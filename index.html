<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雪团 XueTuan</title>
<meta name="description" content="雪团：厦马同学自己的吃喝玩乐地图。记录去过的地方、打分、拍照，收藏想去的地方。">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="only light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 底图瓦片、地点库、地名搜索：提前连上，第一次加载和第一次搜索少等一会儿 -->
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://pshxrwfjcbvqlixdxlzs.supabase.co" crossorigin>
<link rel="preconnect" href="https://photon.komoot.io" crossorigin>
<!-- 网页字体不挡页面：先用手机自带字体画出来，字体到了再换（2026-10-27 提速） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=ZCOOL+QingKe+HuangYou&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* Layout: full-bleed map with floating controls; one panel that is a bottom sheet on phones and a left column on desktop.
   Look: snow white with blue (雪团). Always light, even when the phone is in dark mode. Food is ice blue, travel a deeper blue. */
:root {
  --food: #2E7DCB;          /* ice blue */
  --travel: #4F63D8;        /* deep snow blue */
  --accent: var(--food);
  --accent-ink: #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --bg: #EEF4FA;
  --surface: #FFFFFF;
  --surface-2: #F1F6FB;
  --frost: rgba(255, 255, 255, .86);
  --ink: #1B2A3A;
  --muted: #687A8C;
  --line: #E3EBF3;
  --danger: #D2463F;
  --snow-shadow: 0 6px 24px rgba(40, 90, 140, .13), 0 1px 2px rgba(40, 90, 140, .08);
  --shadow: var(--snow-shadow);
  --font-ui: "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-display: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --sheet-peek: 138px;
  color-scheme: light;
}
/* 深色只在明确要的时候用（现在没有入口）；手机开了深色模式也保持蓝白 */
:root[data-theme="dark"] {
  --food: #6DB1F2; --travel: #8C9BF2; --accent-ink: #0B1520;
  --bg: #0B121A; --surface: #121B25; --surface-2: #1A2531; --frost: rgba(18, 27, 37, .86);
  --ink: #E6EEF6; --muted: #93A4B5; --line: #25313E;
  --shadow: 0 8px 26px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
html.mode-travel { --accent: var(--travel); }
/* 老一点的手机浏览器没有 color-mix：给浅色主题一个固定的浅底色 */
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  :root { --accent-soft: #E6F0FA; }
  html.mode-travel { --accent-soft: #E8EBFB; }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
a { color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
.maplibregl-canvas:focus-visible { outline: none; }
.muted { color: var(--muted); }
.frost { background: var(--frost); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); box-shadow: var(--shadow); }

/* ---------- shell ---------- */
/* 高度用 JS 量出来的真实可见高度（--app-h），不用 100vh / dvh：有些手机浏览器的地址栏、工具栏会让这两个值不准 */
.app { position: fixed; top: 0; top: var(--app-top, 0px); left: 0; right: 0; height: 100%; height: var(--app-h, 100%); overflow: hidden; }
/* 键盘弹起时收起标签栏，面板占满 */
html.kb-open { --tabbar: 0px; }
html.kb-open .tabbar { display: none; }
html.kb-open .panel { height: calc(var(--app-h, 100vh) - env(safe-area-inset-top, 0px) - 8px); }
/* 面板拉满时，地图右上角的按钮会从面板顶上露出一截，干脆藏起来 */
body[data-snap="full"] .map-ctrls, body[data-snap="full"] .map-chips { opacity: 0; pointer-events: none; }
.stage { position: absolute; top: 0; right: 0; bottom: 0; left: 0; --sheet-visible: 0px; }
/* 地球缩小时露出来的背景：飘雪的天空 */
#map {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  background-color: #E4EEF8;
  background-image:
    radial-gradient(2px 2px at 8% 14%, rgba(255,255,255,.95) 50%, transparent 60%),
    radial-gradient(1.6px 1.6px at 23% 72%, rgba(255,255,255,.9) 50%, transparent 60%),
    radial-gradient(2.4px 2.4px at 37% 26%, rgba(255,255,255,.95) 50%, transparent 60%),
    radial-gradient(1.6px 1.6px at 52% 90%, rgba(255,255,255,.85) 50%, transparent 60%),
    radial-gradient(2px 2px at 66% 10%, rgba(255,255,255,.95) 50%, transparent 60%),
    radial-gradient(1.6px 1.6px at 79% 64%, rgba(255,255,255,.9) 50%, transparent 60%),
    radial-gradient(2.6px 2.6px at 92% 33%, rgba(255,255,255,.95) 50%, transparent 60%),
    radial-gradient(1.6px 1.6px at 13% 47%, rgba(255,255,255,.8) 50%, transparent 60%),
    radial-gradient(1.4px 1.4px at 44% 56%, rgba(255,255,255,.8) 50%, transparent 60%),
    radial-gradient(2px 2px at 85% 87%, rgba(255,255,255,.9) 50%, transparent 60%),
    radial-gradient(1.4px 1.4px at 60% 38%, rgba(255,255,255,.8) 50%, transparent 60%),
    radial-gradient(ellipse 80% 70% at 50% 42%, #FBFDFF 0%, #E3EEF9 55%, #C9DDF1 100%);
}
/* 谷歌底图试用：谷歌地图在 #map 里最下面，MapLibre 的画布透明、不接手势 */
html.gmap-on #map { background: #E8EEF3; }
#map .gmap { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
html.gmap-on #map .maplibregl-canvas-container, html.gmap-on #map .maplibregl-canvas { pointer-events: none; }
html.gmap-on .attrib, html.gmap-on .home-attrib { display: none; }
/* 首页小地图：谷歌标志在左下角，“探索地图”挪到左上角，不挡标志 */
html.gmap-on .home-map-btn { align-items: flex-start; }
.map-error {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 4; display: grid; place-items: center;
  padding: 24px; text-align: center; color: var(--ink); font-weight: 600; font-size: 15px;
}

/* ---------- map buttons (top right) ---------- */
.brand-badge {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #FFFFFF 0%, #EAF4FE 45%, #BCD9F5 100%);
  box-shadow: inset 0 -2px 4px rgba(46, 125, 203, .18), 0 1px 3px rgba(40, 90, 140, .18);
  color: #2E7DCB; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 14px; line-height: 1; letter-spacing: .02em;
}
/* 地图右上角：搜索、吃/玩切换（显示要切去的那个：吃的地图上是飞机）、筛选、点亮国家 */
.map-ctrls {
  position: absolute; z-index: 9; right: max(12px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  display: flex; flex-direction: column; gap: 8px;
}
.map-ctrls .icon-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; }
.map-ctrls .icon-btn svg { width: 18px; height: 18px; }
/* 全是蓝白：白底蓝图标；吃/玩切换用要切去的那张地图的蓝色（吃的地图上是深一点的蓝色飞机） */
.map-ctrls .search-btn, .map-ctrls .filter-btn, .map-ctrls .globe-btn { color: var(--accent); }
.map-ctrls .mode-btn { color: #fff; background: linear-gradient(145deg, #7D8EF2, #4A5BD0); box-shadow: 0 5px 14px rgba(79, 99, 216, .35); }
html.mode-travel .map-ctrls .mode-btn { background: linear-gradient(145deg, #5AA5EC, #2569B3); box-shadow: 0 5px 14px rgba(46, 125, 203, .35); }
.map-ctrls .filter-btn[aria-pressed="true"], .map-ctrls .globe-btn[aria-pressed="true"] { color: #fff; background: var(--accent); }
.map-ctrls .icon-btn b {
  position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink); font-size: 10px; line-height: 16px; text-align: center;
}
.map-ctrls .filter-btn[aria-pressed="true"] b, .map-ctrls .globe-btn b { background: #fff; color: var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
/* 地图左上角的说明小签：旅行大地图上“红针 = 同学的家乡”，点一下收起 / 显示这些红针 */
.map-chips {
  position: absolute; z-index: 9; left: max(12px, env(safe-area-inset-left, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  display: flex; gap: 8px; max-width: calc(100% - 76px);
}
.map-chip {
  display: inline-flex; align-items: center; gap: 5px; min-width: 0; height: 32px; padding: 0 11px 0 8px;
  border: 0; border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap;
}
.map-chip svg { flex: none; width: 16px; height: 20px; }
.map-chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.map-chip b { color: var(--muted); font-weight: 700; }
.map-chip[aria-pressed="false"] { color: var(--muted); }
.map-chip[aria-pressed="false"] svg { filter: grayscale(1); opacity: .5; }
.icon-btn {
  flex: none; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 12px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  display: grid; place-items: center;
}
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.flat { width: 32px; height: 32px; margin-left: -6px; border-radius: 50%; background: none; box-shadow: none; }
/* 手机上点过的东西会一直停在悬停状态，悬停底色只给有鼠标的设备 */
@media (hover: hover) { .icon-btn.flat:hover { background: var(--surface-2); } }

/* ---------- chips (filter sheet, forms) ---------- */
.chip {
  height: 30px; padding: 0 11px; border-radius: 999px; border: 0;
  background: none; color: var(--ink); font-size: 12.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
@media (hover: hover) { .chip:hover { background: var(--surface-2); } }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.chip svg { width: 15px; height: 15px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(40, 90, 140, .16); }
.form .seg { display: flex; }
.form .seg button { flex: 1; min-width: 0; padding: 0 8px; }

/* ---------- locate button + bottom tab bar ---------- */
:root { --tabbar: calc(50px + env(safe-area-inset-bottom, 0px)); }
.locate-btn {
  position: absolute; z-index: 9;
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--sheet-visible) + var(--tabbar) + 12px);
  width: 36px; height: 36px; border-radius: 50%;
  transition: bottom .34s cubic-bezier(.2, .8, .2, 1);
}
.locate-btn svg { width: 18px; height: 18px; }
/* 回 XMUM：定位按钮左边一个一样的圆钮，学士帽 */
.campus-btn {
  position: absolute; z-index: 9;
  right: calc(max(12px, env(safe-area-inset-right, 0px)) + 44px);
  bottom: calc(var(--sheet-visible) + var(--tabbar) + 12px);
  width: 36px; height: 36px; border-radius: 50%;
  transition: bottom .34s cubic-bezier(.2, .8, .2, 1);
}
.campus-btn svg { width: 20px; height: 20px; }
.tabbar {
  position: absolute; z-index: 30; left: 0; right: 0; bottom: 0;
  height: var(--tabbar); padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: stretch;
  background: var(--surface); box-shadow: 0 -1px 0 var(--line), 0 -6px 20px rgba(40, 90, 140, .06);
}
.tab {
  min-width: 0; border: 0; background: none; padding: 5px 2px 3px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); font-size: 10px; font-weight: 600; line-height: 1.1;
}
.tab svg { width: 20px; height: 20px; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--accent); }
/* 加一笔：只在我的地图上，定位按钮上面一个蓝色圆钮 */
.add-fab {
  position: absolute; z-index: 9; display: none; place-items: center;
  right: calc(max(12px, env(safe-area-inset-right, 0px)) - 4px);
  bottom: calc(var(--sheet-visible) + var(--tabbar) + 58px);
  width: 44px; height: 44px; border-radius: 50%; border: 0;
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent);
  transition: bottom .34s cubic-bezier(.2, .8, .2, 1), background-color .3s, transform .15s;
}
.add-fab:active { transform: scale(.94); }
.add-fab svg { width: 22px; height: 22px; }
html.scope-my .add-fab { display: grid; }
body[data-snap="full"] .add-fab { opacity: 0; pointer-events: none; }
.attrib {
  position: absolute; z-index: 8;
  left: max(8px, env(safe-area-inset-left, 0px));
  bottom: calc(var(--sheet-visible) + var(--tabbar) + 6px);
  max-width: calc(100% - 104px); padding: 1px 6px; border-radius: 6px;
  background: rgba(255, 255, 255, .6); color: #5A6B7C; font-size: 10px; line-height: 1.45;
  transition: bottom .34s cubic-bezier(.2, .8, .2, 1);
}
.attrib a { color: inherit; text-decoration: none; }
.attrib a:hover { text-decoration: underline; }
body.picking .tabbar, body.picking .map-ctrls, body.picking .map-chips, body.picking .locate-btn, body.picking .campus-btn, body.picking .add-fab { display: none; }
body.picking .attrib { bottom: calc(env(safe-area-inset-bottom, 0px) + 122px); }

/* ---------- bottom sheets (filters, places) ---------- */
.bsheet { position: fixed; top: 0; right: 0; left: 0; bottom: auto; height: 100%; height: var(--app-h, 100%); z-index: 65; display: flex; align-items: flex-end; justify-content: center; background: rgba(20, 40, 60, .32); }
.bsheet-card {
  width: min(560px, 100%); max-height: 82vh; overflow-y: auto; overscroll-behavior: contain;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  border-radius: 24px 24px 0 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  animation: sheet-up .26s cubic-bezier(.2, .8, .2, 1);
}
@keyframes sheet-up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.bsheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0 4px; }
.bsheet-head h3 { margin: 0; font-size: 16px; font-weight: 800; }
.bsheet .field { margin-top: 14px; }
.bsheet-foot { position: sticky; bottom: -16px; display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 20px; padding: 10px 0 0; background: var(--surface); }
.bsheet-foot.single { grid-template-columns: 1fr; }
.area-opt {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 4px; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left; font-size: 14px; font-weight: 600; color: var(--ink);
}
.area-opt svg { flex: none; width: 18px; height: 18px; color: var(--accent); }
.area-opt.muted { color: var(--muted); font-weight: 500; }
.area-opt:last-child { border-bottom: 0; }

/* ---------- pick mode ---------- */
.pick { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 12; pointer-events: none; }
.pick-hint {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 12px;
  background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 600; text-align: center;
  box-shadow: var(--shadow);
}
.pick-pin { position: absolute; left: 50%; top: 50%; width: 46px; height: 58px; transform: translate(-50%, -100%); filter: drop-shadow(0 5px 6px rgba(20, 50, 80, .3)); animation: hover-pin 1.6s ease-in-out infinite; }
.pick-pin svg { width: 100%; height: 100%; display: block; }
.pick-pin path { fill: var(--accent); }
.pick-dot { position: absolute; left: 50%; top: 50%; width: 10px; height: 4px; margin: -2px 0 0 -5px; border-radius: 50%; background: rgba(20, 50, 80, .4); }
@keyframes hover-pin { 0%, 100% { transform: translate(-50%, -100%); } 50% { transform: translate(-50%, calc(-100% - 7px)); } }
.pick-bar {
  position: absolute; pointer-events: auto;
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  max-width: 460px; margin: 0 auto; padding: 12px; border-radius: 20px;
  background: var(--surface); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
}
.pick-prec { font-size: 13px; color: var(--muted); text-align: center; }
.pick-prec b { color: var(--ink); }
.pick-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }

/* ---------- panel (sheet on phones) ---------- */
.panel {
  position: absolute; z-index: 20; left: 0; right: 0; bottom: var(--tabbar);
  height: calc(100vh - var(--tabbar) - 64px);
  height: calc(var(--app-h, 100vh) - var(--tabbar) - env(safe-area-inset-top, 0px) - 64px);
  display: flex; flex-direction: column;
  background: var(--surface); border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 30px rgba(40, 90, 140, .16);
  transform: translateY(calc(100% - var(--visible, 96px)));
  transition: transform .34s cubic-bezier(.2, .8, .2, 1);
}
.panel.dragging, .panel.no-anim { transition: none; }
.panel::after { content: ""; flex: none; height: var(--hidden, 0px); }
/* 首页、我的、帖子是整页，不是能拖的面板：从屏幕顶上一直到底部栏，盖住地图 */
body[data-snap="page"] .panel { height: calc(var(--app-h, 100vh) - var(--tabbar)); border-radius: 0; box-shadow: none; }
body[data-snap="page"] .grip { display: none; }
body[data-snap="page"] .panel-body { padding-top: env(safe-area-inset-top, 0px); }
.grip { flex: none; height: 20px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grip span { width: 34px; height: 4px; border-radius: 2px; background: var(--line); }
.panel-brand { display: none; align-items: center; gap: 12px; padding: 20px 20px 14px; }
.brand-name { font-weight: 800; font-size: 17px; letter-spacing: -.01em; line-height: 1.2; }
.brand-name span { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin-right: 2px; color: var(--accent); }
.brand-tag { font-size: 12.5px; color: var(--muted); }
.panel-body {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) 20px max(18px, env(safe-area-inset-left, 0px));
}

/* ---------- views ---------- */
.title-row { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.view-title { margin: 0; font-size: 16.5px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.title-row .view-title { cursor: pointer; }
.count { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.sample-note {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 0; padding: 2px 0 6px; font-size: 12px; color: var(--muted);
}

.search-box { flex: 1; min-width: 0; }
.area-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.note { margin: 0; color: var(--muted); font-size: 13px; }
.about { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

/* ---------- 首页：品牌 + 搜索，地图预览，最新分享（两列图文卡片） ---------- */
.home-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 12px 0 10px; background: var(--surface); }
.home-brand { flex: none; display: flex; align-items: center; gap: 7px; }
.home-brand .brand-badge { width: 30px; height: 30px; font-size: 11px; }
.home-brand b { font-family: var(--font-display); font-weight: 400; font-size: 23px; line-height: 1; color: var(--food); }
.home-search {
  flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border: 0; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); font-size: 13.5px; text-align: left;
}
.home-search svg { flex: none; width: 17px; height: 17px; color: var(--accent); }
.home-search span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 地图预览就是那张地图，挪进这张卡片；上面盖一个透明按钮，点了去探索，手指上下划照样滚页面 */
.home-map { position: relative; height: 188px; margin: 2px 0 4px; border-radius: 16px; overflow: hidden; background: #E4EEF8; }
.home-map #map { border-radius: inherit; }
.home-map-btn {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 2; display: flex; align-items: flex-end; padding: 10px;
  border: 0; border-radius: inherit; background: none; touch-action: pan-y; box-shadow: inset 0 0 0 1px rgba(40, 90, 140, .1);
}
.hm-pill {
  display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px;
  background: var(--surface); color: var(--accent); font-size: 12.5px; font-weight: 700; box-shadow: var(--shadow);
}
.hm-pill svg { width: 16px; height: 16px; }
.home-map .home-attrib {
  position: absolute; z-index: 3; right: 6px; bottom: 5px; max-width: 55%; padding: 0 5px; border-radius: 5px;
  background: rgba(255, 255, 255, .7); color: #5A6B7C; font-size: 9px; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.home-attrib a { color: inherit; text-decoration: none; }
.home-sec { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 10px; }
.home-sec h2 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.01em; }
.home-sec small { color: var(--muted); font-size: 12px; }
.home-empty { padding: 4px 2px 16px; }
.post-grid { list-style: none; margin: 0; padding: 0 0 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 8px; }
.post-card { position: relative; min-width: 0; }
.pc-open {
  width: 100%; height: 100%; display: flex; flex-direction: column; padding: 0; border: 0; border-radius: 12px; overflow: hidden;
  background: var(--surface); text-align: left; box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(40, 90, 140, .07);
}
/* 封面一律是方的：有照片放照片，没照片放一段评论 */
.pc-cover { position: relative; display: block; width: 100%; background: var(--surface-2); }
.pc-cover::before { content: ""; display: block; padding-top: 100%; }
.pc-cover img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
.pc-cover .fi-count { right: 6px; bottom: 6px; }
.pc-words {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px;
  background: linear-gradient(160deg, #F4F8FD, #E3EEF9); color: var(--ink);
}
.pc-words.travel { background: linear-gradient(160deg, #F5F6FE, #E5E9FB); }
.pc-words i { font-style: normal; font-size: 24px; line-height: 1; }
.pc-words span { font-size: 14px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.pc-body { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 8px 10px 9px; }
.pc-place { font-size: 13.5px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc-score { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.pc-who { margin-top: auto; padding-top: 2px; padding-right: 24px; display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--muted); font-size: 11.5px; }
.pc-who .avatar { width: 18px; height: 18px; font-size: 10px; }
.pc-who span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-save { position: absolute; right: 2px; bottom: 2px; width: 32px; height: 32px; padding: 0; border: 0; background: none; color: #A3B1BF; display: grid; place-items: center; }
.pc-save svg { width: 17px; height: 17px; }
.pc-save[aria-pressed="true"] { color: var(--accent); }

/* ---------- 帖子详情 ---------- */
.post-who { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; }
.post-who .avatar { width: 36px; height: 36px; font-size: 15px; }
.pw-text { min-width: 0; display: flex; flex-direction: column; }
.pw-text b { font-size: 14.5px; overflow-wrap: anywhere; }
.pw-text small { color: var(--muted); font-size: 12px; }
.post-score { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.post-score .stars-mini .st, .post-score .stars-mini .st svg { width: 17px; height: 17px; }
.post-score b { font-size: 16px; font-weight: 800; }
.post-text { margin: 10px 0 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.post-place { margin-top: 14px; border-top: 1px solid var(--line); }
.post-place .near-item { border-bottom: 1px solid var(--line); }
.post-actions { margin-top: 12px; }
.post-actions .save-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.place-empty { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

/* ---------- 我的：头像、昵称、来自哪、数量 ---------- */
.me-head { display: flex; align-items: center; gap: 14px; padding: 18px 0 14px; }

.me-id small { color: var(--muted); font-size: 12.5px; }
.me-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0 0 18px; padding: 10px 0; border-radius: 14px; background: var(--surface-2); }
.me-stat { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 2px 0; border: 0; background: none; color: var(--ink); }
.me-stat + .me-stat { border-left: 1px solid var(--line); }
.me-stat b { font-size: 18px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
.me-stat small { color: var(--muted); font-size: 12px; }
.me-login { margin: 0 0 18px; }

/* ---------- overlays ---------- */
.toast {
  position: fixed; z-index: 60; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 128px); padding: 10px 16px; border-radius: 999px; text-align: center;
  background: var(--ink); color: var(--surface); font-size: 13px; font-weight: 600; box-shadow: var(--shadow);
}
.modal { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 70; display: grid; place-items: center; padding: 20px; background: rgba(20, 40, 60, .38); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.modal-card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: 22px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.modal-card h3 { margin: 0; font-size: 18px; }
.modal-card p { margin: 0; }
.lightbox { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 80; display: grid; place-items: center; background: rgba(6, 12, 18, .93); }
.lightbox img, .lightbox video { max-width: min(92vw, 1200px); max-height: 84vh; border-radius: 10px; object-fit: contain; }
.lightbox [hidden] { display: none; }
.lb-btn { position: absolute; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .14); color: #fff; font-size: 22px; display: grid; place-items: center; }
.lb-close { top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(14px, env(safe-area-inset-right, 0px)); }
.lb-prev { left: max(14px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); }
.lb-next { right: max(14px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); }
.lb-count { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); color: #fff; font-size: 13px; font-weight: 600; }
.drop-pulse { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); animation: drop-pulse 1.4s ease-out 1 forwards; }
@keyframes drop-pulse {
  0% { transform: scale(.4); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  60% { transform: scale(1); box-shadow: 0 0 0 26px transparent; }
  100% { transform: scale(1); opacity: 0; box-shadow: 0 0 0 30px transparent; }
}

/* ---------- desktop ---------- */
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 400px minmax(0, 1fr); }
  .stage { position: relative; }
  .panel {
    position: relative; z-index: 5; bottom: auto; height: auto; transform: none !important; transition: none;

  .panel-body { padding: 0 22px 24px; }
  .tabbar { right: auto; width: 400px; border-right: 1px solid var(--line); }

  .feed-item { border-radius: 12px; padding: 14px 8px; }

@media (prefers-reduced-motion: reduce) {
  .pick-pin, .drop-pulse { animation: none; }
  .panel, .locate-btn, .campus-btn, .add-fab, .attrib, .bsheet-card { transition: none; animation: none; }
}

      author = author || r.author || {};
      return {
        id: r.id, placeId: r.place_id, authorId: r.user_id, authorName: author.name || '',
        rating: r.rating == null ? null : +r.rating, price: r.price == null ? null : +r.price, text: r.text, photos: r.photos || [],
        visibility: r.visibility, createdAt: Date.parse(r.created_at), sample: false
      };
    }
    /* 看得见的家：公开的 + 我自己的（RLS 已经过滤好） */
    function homeFromRow(r) {
      return { userId: r.user_id, name: (r.owner && r.owner.name) || '', city: r.city, lat: r.lat, lng: r.lng, public: !!r.is_public };
    }
    /* 动图和短视频的 id 带后缀（ph_x.gif / ph_x.mp4），照片没有，存成 .jpg */
    function photoPath(id) { return uidNow() + '/' + id + (/\.\w+$/.test(id) ? '' : '.jpg'); }
    /* 小图和原图放在同一个文件夹：xxx.jpg（.gif / .mp4）的小图是 xxx_t.jpg */
    function thumbPath(path) { return path.replace(/\.(jpg|gif|mp4|mov|webm)$/i, '_t.jpg'); }
    /* 传照片（原图 + 小图），返回传成功的路径和是否全部成功；小图传不上去就算了，显示时会退回原图 */
    function uploadPhotos(photos) {
      var bucket = client.storage.from('photos');
      return Promise.all(photos.map(function (ph) {
        var path = photoPath(ph.id);
        return bucket.upload(path, ph.blob, { contentType: mediaType(path), upsert: false }).then(function (res) {
          if (res.error) return null;
          if (ph.url) photoURLs.set(path, ph.url);
          if (!ph.thumb) return path;
          photoURLs.set(path + THUMB_KEY, URL.createObjectURL(ph.thumb));
          return bucket.upload(thumbPath(path), ph.thumb, { contentType: 'image/jpeg', upsert: false }).then(function () { return path; }, function () { return path; });
        }, function () { return null; });
      })).then(function (paths) {
        var good = paths.filter(Boolean);
        return { paths: good, ok: good.length === photos.length };
      });
    }
    function removePhotos(paths) {
      if (!paths.length) return Promise.resolve();
      paths.forEach(function (p) { photoURLs.delete(p); photoURLs.delete(p + THUMB_KEY); });
      return client.storage.from('photos').remove(paths.concat(paths.map(thumbPath))).then(function () {}, function () {});
    }

    function loadAll() {
      var uid = uidNow();
      return Promise.all([
        client.from('places').select('*').limit(10000),
        client.from('visits').select('*, author:profiles(name)').order('created_at', { ascending: false }).limit(10000),
        uid ? client.from('profiles').select('*').eq('id', uid).maybeSingle() : Promise.resolve({ data: null }),
        uid ? client.from('wishlist').select('*') : Promise.resolve({ data: [] }),
        /* 家这张表是后加的，读不到也别让整个应用打不开 */
        client.from('homes').select('user_id, city, lat, lng, is_public, owner:profiles(name)').limit(10000).then(function (r) { return r.error ? { data: [] } : r; }, function () { return { data: [] }; })
      ]).then(function (res) {
        var places = ok(res[0]), visits = ok(res[1]), profile = ok(res[2]), wish = ok(res[3]);
        cache.homes = (res[4].data || []).map(homeFromRow);
        cache.places = places.map(placeFromRow);
        cache.reviews = visits.map(function (v) { return reviewFromRow(v); });
        cache.profile = uid ? Object.assign({}, ANON, profile || {}, { id: uid }) : ANON;
        cache.wishlist = (wish || []).map(function (w) { return { placeId: w.place_id, createdAt: Date.parse(w.created_at) }; });
      });
    }
    function setSession(s) {
      var before = uidNow();
      session = s;
      email = s && s.user ? s.user.email || '' : '';

    }

    var profileTimer = null, profilePatch = {};

      var patch = profilePatch, uid = uidNow();

    var areas = {

    return {
      mode: 'remote',

      },

      /* ---- 读 ---- */
      me: function () { return cache.profile; },

      reviews: function () { return cache.reviews; },

      photoURL: function (id, small) {

        var u = client.storage.from('photos').getPublicUrl(small ? thumbPath(id) : id).data.publicUrl;

      /* ---- 写 ---- */
      addPlace: function (f) {
        return needLogin() || client.from('places').insert(placeToRow(f)).select().single().then(ok).then(function (row) {

      addReview: function (f, newPhotos) {
        return needLogin() || uploadPhotos(newPhotos).then(function (up) {
          var row = { place_id: f.placeId, rating: f.rating, price: f.price, text: f.text, visibility: f.visibility, photos: up.paths };
          if (f.createdAt) row.created_at = new Date(f.createdAt).toISOString();
          return client.from('visits').insert(row).select().single().then(ok).then(function (v) {
            var r = reviewFromRow(v, cache.profile);
            cache.reviews.unshift(r);

      },
      updateReview: function (id, patch, keepPhotos, newPhotos) {
        var r = find(cache.reviews, id);
        if (!r) return Promise.reject(new Error('missing'));
        return needLogin() || uploadPhotos(newPhotos).then(function (up) {
          var dropped = (r.photos || []).filter(function (p) { return keepPhotos.indexOf(p) === -1; });
          var row = { rating: patch.rating, price: patch.price, text: patch.text, visibility: patch.visibility, photos: keepPhotos.concat(up.paths) };
          return client.from('visits').update(row).eq('id', id).select().single().then(ok).then(function (v) {
            removePhotos(dropped);
            Object.assign(r, reviewFromRow(v, cache.profile));
            return { review: r, photosOk: up.ok };
          });
        });
      },
      /* 删最后一条记录、又没人想去时，数据库会顺带删地点；删完查一下地点还在不在（或者我还看不看得见） */
      deleteReview: function (id) {
        var r = find(cache.reviews, id);
        if (!r) return Promise.reject(new Error('missing'));
        return needLogin() || client.from('visits').delete().eq('id', id).then(ok).then(function () {
          removePhotos(r.photos || []);
          cache.reviews = cache.reviews.filter(function (x) { return x.id !== id; });
          return client.from('places').select('id').eq('id', r.placeId).then(ok);
        }).then(function (rows) {
          var gone = !rows.length;
          if (gone) {
            cache.places = cache.places.filter(function (p) { return p.id !== r.placeId; });
            cache.wishlist = cache.wishlist.filter(function (w) { return w.placeId !== r.placeId; });
          }
          return { placeRemoved: gone };
        });
      },
      setSaved: function (placeId, saved) {
        var q = saved
          ? client.from('wishlist').insert({ place_id: placeId })
          : client.from('wishlist').delete().eq('place_id', placeId).eq('user_id', uidNow());
        return needLogin() || q.then(ok).then(function () {
          cache.wishlist = cache.wishlist.filter(function (w) { return w.placeId !== placeId; });
          if (saved) { cache.wishlist.push({ placeId: placeId, createdAt: Date.now() }); return saved; }
          /* 没人记录、也没人想去的地点，数据库会顺带删掉；查一下还在不在 */
          if (cache.reviews.some(function (r) { return r.placeId === placeId; })) return saved;
          return client.from('places').select('id').eq('id', placeId).then(ok).then(function (rows) {
            if (!rows.length) cache.places = cache.places.filter(function (p) { return p.id !== placeId; });
            return saved;
          });
        });
      },
      setHome: function (h) {
        var id = uidNow();
        if (!id) return Promise.reject(new Error('login required'));
        var q = h
          ? client.from('homes').upsert({ user_id: id, city: h.city, lat: h.lat, lng: h.lng, is_public: !!h.public }).select('user_id, city, lat, lng, is_public').single()
          : client.from('homes').delete().eq('user_id', id);
        return q.then(ok).then(function (row) {
          cache.homes = cache.homes.filter(function (x) { return x.userId !== id; });
          if (!h) return null;
          var home = homeFromRow(row);
          home.name = cache.profile.name || '';
          cache.homes.push(home);
          return home;
        });
      },
      updateProfile: function (patch) {
        if (!uidNow()) return Promise.reject(new Error('login required'));
        Object.keys(patch).forEach(function (k) { cache.profile[k] = patch[k]; profilePatch[k] = patch[k]; });
        cache.reviews.forEach(function (r) {
          if (r.authorId === uidNow()) r.authorName = cache.profile.name || '';
        });
        clearTimeout(profileTimer);
        profileTimer = setTimeout(flushProfile, 400);
        return Promise.resolve(cache.profile);
      },
      addArea: function (a) {
        var area = { id: uid('a'), name: a.name, lng: a.lng, lat: a.lat, zoom: a.zoom };
        areaCache.push(area);
        areas.save(areaCache);
        return Promise.resolve(area);
      },
      deleteArea: function (id) {
        areaCache = areaCache.filter(function (x) { return x.id !== id; });
        areas.save(areaCache);
        return Promise.resolve();
      },
      clearSamples: function () { return Promise.resolve(); },

      /* ---- 备份 ----
       * 导出：我自己的记录和它们的地点（照片是网址，不打包）。
       * 导入：把备份里的记录当成我的，上传到账号。用来把本地版存的东西搬上来。
       */
      exportBackup: function () {
        var mine = cache.reviews.filter(function (r) { return r.authorId === uidNow(); });
        var ids = {};
        mine.forEach(function (r) { ids[r.placeId] = 1; });
        return Promise.resolve({
          app: BACKUP_APP, version: 2, exportedAt: new Date().toISOString(), profile: cache.profile,
          places: cache.places.filter(function (p) { return ids[p.id]; }), reviews: mine, wishlist: cache.wishlist, areas: areaCache, photos: {}
        });
      },
      importBackup: function (obj) {
        if (!obj || BACKUP_APPS.indexOf(obj.app) === -1 || !Array.isArray(obj.places) || !Array.isArray(obj.reviews)) return Promise.resolve(-1);
        if (!uidNow()) return Promise.reject(new Error('login required'));
        var self = this;
        var srcPlaces = {}, newIds = {}, added = 0;
        obj.places.forEach(function (p) { if (p && p.id && !p.sample && CATS[p.mode]) srcPlaces[p.id] = p; });
        var reviews = obj.reviews.filter(function (r) { return r && !r.sample && srcPlaces[r.placeId]; });
        var photos = obj.photos || {};
        return reviews.reduce(function (chain, r) {
          return chain.then(function () {
            var src = srcPlaces[r.placeId];
            var placeStep = newIds[src.id] ? Promise.resolve(self.place(newIds[src.id])) : self.addPlace({
              mode: src.mode, cat: src.cat, precision: src.precision || 'exact', lat: src.lat, lng: src.lng,
              name: String(src.name || src.altName || '?').slice(0, 60), altName: String(src.altName || '').slice(0, 60), link: src.link || '', osm: src.osm || ''
            }).then(function (p) { newIds[src.id] = p.id; added++; return p; });
            return placeStep.then(function (p) {
              var blobs = (r.photos || []).filter(function (id) { return photos[id]; }).slice(0, MAX_PHOTOS).map(function (id) {
                return dataURLToBlob(photos[id]).then(function (b) { return { id: uid('ph'), blob: b }; });
              });
              return Promise.all(blobs).then(function (list) {
                return self.addReview({
                  placeId: p.id, rating: r.rating == null ? null : clamp(Math.round(r.rating * 2) / 2, 0, 5), price: r.price || null,
                  text: String(r.text || '').slice(0, 1000), visibility: r.visibility === 'private' ? 'private' : 'public'
                }, list);
              });
            });
          });
        }, Promise.resolve()).then(function () {
          var wish = (obj.wishlist || []).map(function (w) { return newIds[w.placeId]; }).filter(Boolean);
          return Promise.all(wish.map(function (id) { return self.isSaved(id) ? null : self.setSaved(id, true); }));
        }).then(function () { return added; });

  }

  /* 有 Supabase 配置就用线上版；地址里加 ?local 或者 supabase 库没加载出来时用本地版 */

  var sbClient = window.supabase && window.supabase.createClient && SUPABASE_URL ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
  var store = (function () {

  function loadView() {

  var photoStore = {
    db: null, mem: new Map(), ready: null,
    open: function () {
      var self = this;
      if (self.ready) return self.ready;
      self.ready = new Promise(function (resolve) {
        var req;
        try { req = indexedDB.open('xmum-chiwan-photos', 1); } catch (e) { resolve(null); return; }
        req.onupgradeneeded = function () { req.result.createObjectStore('photos'); };
        req.onsuccess = function () { self.db = req.result; resolve(self.db); };
        req.onerror = function () { resolve(null); };
        req.onblocked = function () { resolve(null); };
      });
      return self.ready;
    },
    put: function (id, blob) {
      var self = this;
      return self.open().then(function (db) {
        if (!db) { self.mem.set(id, blob); return false; }
        return new Promise(function (resolve) {
          try {
            var tx = db.transaction('photos', 'readwrite');
            tx.objectStore('photos').put(blob, id);
            tx.oncomplete = function () { resolve(true); };
            tx.onerror = tx.onabort = function () { self.mem.set(id, blob); resolve(false); };
          } catch (e) { self.mem.set(id, blob); resolve(false); }
        });
      });
    },
    get: function (id) {
      var self = this;
      if (self.mem.has(id)) return Promise.resolve(self.mem.get(id));
      return self.open().then(function (db) {
        if (!db) return null;
        return new Promise(function (resolve) {
          try {
            var r = db.transaction('photos').objectStore('photos').get(id);
            r.onsuccess = function () { resolve(r.result || null); };
            r.onerror = function () { resolve(null); };
          } catch (e) { resolve(null); }
        });
      });
    },
    del: function (id) {
      this.mem.delete(id);
      return this.open().then(function (db) {
        if (!db) return;
        try { db.transaction('photos', 'readwrite').objectStore('photos').delete(id); } catch (e) { /* ignore */ }
      });
    }
  };

  /* ================= helpers ================= */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function t(key, vars) {
    var table = I18N[state.lang] || I18N.zh;
    var s = table[key] != null ? table[key] : (I18N.zh[key] != null ? I18N.zh[key] : key);
    if (vars) s = s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; });
    return s;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function round6(v) { return Math.round(v * 1e6) / 1e6; }
  function haversine(a, b) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function fmtDist(m) {
    if (m < 100) return Math.round(m) + ' m';
    if (m < 1000) return Math.round(m / 10) * 10 + ' m';
    if (m < 10000) return (m / 1000).toFixed(1) + ' km';
    return Math.round(m / 1000).toLocaleString(state.lang === 'zh' ? 'zh-CN' : 'en-MY') + ' km';
  }
  function fmtPrice(n) { var v = Math.round(n * 10) / 10; return v % 1 === 0 ? String(v) : v.toFixed(1); }
  function timeAgo(ts) {
    var d = Date.now() - ts, min = 60000;
    if (d < min) return t('justNow');
    if (d < 60 * min) return t('minAgo', { n: Math.floor(d / min) });
    if (d < 24 * 60 * min) return t('hourAgo', { n: Math.floor(d / (60 * min)) });
    if (d < 30 * 24 * 60 * min) return t('dayAgo', { n: Math.floor(d / (24 * 60 * min)) });
    var dt = new Date(ts);
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  }
  function safeURL(u) {
    u = (u || '').trim();
    if (!u) return '';
    try {
      var url = new URL(/^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://' + u);
      return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '';
    } catch (e) { return ''; }
  }

  function me() { return store.me(); }
  function placeById(id) { return store.place(id); }
  function reviewsOf(placeId) { return store.reviewsOf(placeId); }
  /* 按地点分好的记录：画图钉时每个地点都要找自己的记录，原来每次都扫一遍全部记录，
     地点和记录一多就是“地点数 × 记录数”，手机上会卡好几秒。记录数组换了或长度变了才重新分（2026-10-27 提速） */
  var rIdx = { list: null, n: -1, by: null };
  function reviewsByPlace(list, placeId) {
    if (list !== rIdx.list || list.length !== rIdx.n) {
      var by = new Map();
      list.forEach(function (r) { var a = by.get(r.placeId); if (!a) by.set(r.placeId, a = []); a.push(r); });
      rIdx = { list: list, n: list.length, by: by };
    }
    var got = rIdx.by.get(placeId);
    return got ? got.slice() : [];
  }
  function isMine(r) { return r.authorId === me().id; }
  /* 三种地图：all = 探索（公开记录），mine = 我的足迹，saved = 收藏（公开记录 + 我自己的） */
  function scopedReviews(placeId, scope) {
    scope = scope || state.scope;
    return reviewsOf(placeId).filter(function (r) {
      if (scope === 'mine') return isMine(r);
      if (scope === 'saved') return r.visibility === 'public' || isMine(r);
      return r.visibility === 'public';
    });
  }
  /* 看得到的地点：有公开记录或我自己的记录，或者我想去（收藏了还没人记录的地方也算） */
  function visibleToMe(p) {
    return store.isSaved(p.id) || reviewsOf(p.id).some(function (r) { return r.visibility === 'public' || isMine(r); });

    var items = saved ? savedPlaces() : places ? placesInView() : feedReviews();
    var key = {
      food: { all: 'feedFoodAll', mine: 'feedFoodMine', saved: 'feedSavedFood' },
      travel: { all: 'feedTravelAll', mine: 'feedTravelMine', saved: 'feedSavedTravel' }
    }[state.mode][state.scope];
    if (places) key = state.mode === 'food' ? 'placesFoodAll' : 'placesTravelAll';
    if (state.scope === 'mine' && state.mineBoth) key = 'feedBothMine';
    var h = '<div class="view-head"><div class="title-row"><h2 class="view-title" data-action="expand">' + esc(t(key)) + '</h2><span class="count">' + items.length + '</span>' +
      (state.scope !== 'all' ? '<span class="mini-seg top-cta" role="group">' + ['mine', 'saved'].map(function (v) {
        return '<button type="button" data-action="mine-sub" data-v="' + v + '" aria-pressed="' + (state.scope === v) + '">' + (v === 'saved' ? ICON.star : '') + esc(t(v === 'saved' ? 'subSaved' : 'subBeen')) + '</button>';
      }).join('') + '</span>' : '') + '</div></div>';
    if (store.hasSamples() && state.scope === 'all') {
      h += '<div class="sample-note"><span>' + esc(t('samplesShown')) + '</span><button type="button" class="link-btn" data-action="clear-samples">' + esc(t('clearSamples')) + '</button></div>';
    }
    if (!items.length) h += emptyHTML();
    else if (saved) h += '<ul class="near-list">' + items.map(savedItemHTML).join('') + '</ul>';
    else if (places) h += '<p class="explore-hint">' + esc(t('exploreHint')) + '</p>';
    else h += '<ul class="feed">' + items.map(feedItemHTML).join('') + '</ul>';
    view.innerHTML = h;
  }

  function metaHTML(r) {
    var parts = [];
    if (r.rating != null) parts.push(starsMiniHTML(r.rating));
    if (r.price) parts.push('<span>RM ' + fmtPrice(r.price) + '</span>');
    if (r.visibility === 'private') parts.push('<span class="pill">' + esc(t('visPrivateShort')) + '</span>');
    return parts.join('<span class="sep">·</span>');
  }

  /* 列表一条：有照片时第一张照片放在左边代替头像，多张时角上标张数；点进去看大图 */
  function feedItemHTML(r) {
    var p = placeById(r.placeId), c = catOf(p);
    var name = authorLabel(r), from = authorFrom(r), meta = metaHTML(r), text = reviewText(r);
    var n = r.photos ? r.photos.length : 0;
    var lead = n ? '<span class="fi-pic"><img data-photo="' + esc(r.photos[0]) + '" data-small alt="">' +
      (n > 1 ? '<span class="fi-count">' + ICON.camera + n + '</span>' : '') + '</span>' : avatarHTML(name);
    return '<li><button type="button" class="feed-item' + (n ? ' with-pic' : '') + '" data-action="open-place" data-id="' + esc(p.id) + '">' +
      lead +
      '<span class="fi-main">' +
      '<span class="fi-who"><b>' + esc(name) + '</b>' + (from ? '<span class="muted">' + esc(t('fromPrefix') + from) + '</span>' : '') + '<span class="fi-time">' + esc(timeAgo(r.createdAt)) + '</span></span>' +
      '<span class="fi-place">' + catIconHTML(c) + '<span>' + esc(placeTitle(p)) + '</span>' + scoreHTML(stats(p).score) + (p.sample ? '<span class="badge">' + esc(t('sample')) + '</span>' : '') + '</span>' +
      (meta ? '<span class="fi-meta">' + meta + '</span>' : '') +
      (text ? '<span class="fi-text">' + esc(text) + '</span>' : '') +
      '</span></button></li>';
  }

  /* 地点一行：搜索结果、附近已有、收藏列表都用这个。sub 和 right 是已经转义好的 HTML */
  function placeRowHTML(p, action, sub, right) {
    var photo = coverPhoto(p, 'saved');
    var lead = photo ? '<span class="row-pic"><img data-photo="' + esc(photo) + '" data-small alt=""></span>' : catIconHTML(catOf(p));
    return '<li><button type="button" class="near-item" data-action="' + action + '" data-id="' + esc(p.id) + '">' + lead +
      '<span class="near-text"><b>' + esc(placeTitle(p)) + '</b><small>' + sub + '</small></span>' + (right || '') + '</button></li>';
  }
  function savedItemHTML(p) {
    var s = stats(p);
    var sub = esc(catName(catOf(p))) + ' · ' + esc(t('distFrom', { d: fmtDist(haversine(XMUM, p)) }));
    return placeRowHTML(p, 'open-place', sub, s.score != null ? scoreHTML(s.score) : '<span class="near-cta muted">' + esc(t('noRating')) + '</span>');
  }

  /* ================= 首页 =================
   * 上面一张地图预览（点了去探索），下面是大家最新分享的记录：两列图文卡片，点卡片看帖子。
   * 只放真实的公开记录，不放示例；没有就诚实地说没有（V2.0） */
  function homeReviews() {
    return store.reviews().filter(function (r) { return r.visibility === 'public' && !r.sample && placeById(r.placeId); })
      .sort(function (a, b) { return b.createdAt - a.createdAt; }).slice(0, 60);
  }
  function renderHome() {
    var items = homeReviews(), h = '';
    if (isMobile()) {
      h += '<div class="home-top"><div class="home-brand"><span class="brand-badge" aria-hidden="true">雪团</span><b>雪团</b></div>' +
        '<button type="button" class="home-search" data-action="search">' + CTRL_ICON.search + '<span>' + esc(t('searchPh')) + '</span></button></div>' +
        '<div class="home-map" id="home-map"><button type="button" class="home-map-btn" data-action="tab" data-tab="explore" aria-label="' + esc(t('openMap')) + '">' +
        '<span class="hm-pill">' + CTRL_ICON.compass + esc(t('openMap')) + '</span></button>' +
        '<div class="home-attrib">' + $('.attrib').innerHTML + '</div></div>';
    }
    h += '<div class="home-sec"><h2>' + esc(t('latest')) + '</h2></div>';
    if (!items.length) h += '<div class="empty home-empty"><p>' + esc(t('latestEmpty')) + '</p><button type="button" class="link-btn" data-action="add">' + esc(t('goRecord')) + '</button></div>';
    else h += '<ul class="post-grid">' + items.map(postCardHTML).join('') + '</ul>';
    view.innerHTML = h;
  }
  function saveBtnHTML(placeId, small) {
    var on = store.isSaved(placeId), label = t(on ? 'wished' : 'wish');
    return small
      ? '<button type="button" class="pc-save" data-action="save-place" data-id="' + esc(placeId) + '" aria-pressed="' + on + '" aria-label="' + esc(label) + '">' + (on ? ICON.starOn : ICON.star) + '</button>'
      : '<button type="button" class="btn save-btn" data-action="save-place" data-id="' + esc(placeId) + '" aria-pressed="' + on + '">' + (on ? ICON.starOn : ICON.star) + esc(label) + '</button>';
  }
  /* 一张卡片：有照片放第一张，没有就放评论的开头；下面是地点名、分数、谁发的 */
  function postCardHTML(r) {
    var p = placeById(r.placeId), c = catOf(p), name = authorLabel(r), text = reviewText(r), n = r.photos ? r.photos.length : 0;
    var cover = n
      ? '<img data-photo="' + esc(r.photos[0]) + '" data-small alt="">' + (n > 1 ? '<span class="fi-count">' + ICON.camera + n + '</span>' : '')
      : '<span class="pc-words' + (p.mode === 'travel' ? ' travel' : '') + '"><i aria-hidden="true">' + c.emoji + '</i><span>' + esc(text || catName(c)) + '</span></span>';
    var score = (r.rating != null ? starsMiniHTML(r.rating) : '') + (r.price ? '<span>RM ' + fmtPrice(r.price) + '</span>' : '');
    return '<li class="post-card"><button type="button" class="pc-open" data-action="open-post" data-id="' + esc(r.id) + '">' +
      '<span class="pc-cover">' + cover + '</span><span class="pc-body"><span class="pc-place">' + esc(placeTitle(p)) + '</span>' +
      (score ? '<span class="pc-score">' + score + '</span>' : '') +
      '<span class="pc-who">' + avatarHTML(name) + '<span>' + esc(name) + ' · ' + esc(timeAgo(r.createdAt)) + '</span></span></span></button>' +
      saveBtnHTML(p.id, true) + '</li>';
  }

  /* 帖子：一条记录的全文（照片、谁、分数、评论），下面是这个地点，点了去探索地图上看 */
  function renderPost() {
    var r = store.review(state.postId), p = r && placeById(r.placeId);
    if (!p || (r.visibility !== 'public' && !isMine(r))) { goFeed(); return; }
    var name = authorLabel(r), from = authorFrom(r), text = reviewText(r), c = catOf(p);
    var h = '<div class="view-top"><button type="button" class="icon-btn flat" data-action="back" aria-label="' + esc(t('back')) + '">' + ICON.back + '</button></div>';
    if (r.photos && r.photos.length) h += '<div class="photo-strip">' + r.photos.map(function (id) {
      return '<button type="button" class="ph" data-action="photo" data-id="' + esc(id) + '" data-group="post"><img data-photo="' + esc(id) + '" data-small alt=""></button>';
    }).join('') + '</div>';
    h += '<div class="post-who">' + avatarHTML(name) + '<span class="pw-text"><b>' + esc(name) + '</b><small>' + (from ? esc(t('fromPrefix') + from) + ' · ' : '') + esc(timeAgo(r.createdAt)) + '</small></span></div>';
    var sc = [];
    if (r.rating != null) sc.push(starsMiniHTML(r.rating) + '<b style="color:' + scoreColor(r.rating) + '">' + fmtScore(r.rating) + '</b>');
    if (r.price) sc.push('<span>RM ' + fmtPrice(r.price) + ' ' + esc(t(p.mode === 'food' ? 'perPerson' : 'costLabel')) + '</span>');
    if (r.visibility === 'private') sc.push('<span class="pill">' + esc(t('visPrivateShort')) + '</span>');
    if (sc.length) h += '<div class="post-score">' + sc.join('<span class="sep">·</span>') + '</div>';
    if (text) h += '<p class="post-text">' + esc(text) + '</p>';
    h += '<ul class="near-list post-place">' + placeRowHTML(p, 'post-place', esc(catName(c)) + ' · ' + esc(t('distFrom', { d: fmtDist(haversine(XMUM, p)) })), '<span class="near-cta">' + esc(t('postPlace')) + '</span>') + '</ul>';
    h += '<div class="actions post-actions">' + saveBtnHTML(p.id, false) + '</div>';
    view.innerHTML = h;
  }

  /* 空的时候只给一行小字 + 一个文字按钮 */
  function emptyHTML() {
    var filtered = filtersActive();
    var msg = filtered ? t('emptyFiltered')
      : state.scope === 'mine' ? t('emptyMine')
      : state.scope === 'saved' ? t(state.savedWant && store.wishlist().length ? 'emptyWant' : 'emptySaved')
      : t(state.mode === 'food' ? 'emptyFoodAll' : 'emptyTravelAll');
    var btn = filtered
      ? '<button type="button" class="link-btn" data-action="clear-filters">' + esc(t('clearFilters')) + '</button>'
      : state.scope === 'saved'
        ? '<button type="button" class="link-btn" data-action="tab" data-tab="explore">' + esc(t('goExplore')) + '</button>'
        : '<button type="button" class="link-btn" data-action="add">' + esc(t(state.mode === 'food' ? 'addFood' : 'addTravel')) + '</button>';
    return '<div class="empty"><p>' + esc(msg) + '</p>' + btn + '</div>';
  }

  function scoreLabel(s) {
    if (state.scope === 'mine') return s.score != null ? t('myScore') : t('noRating');
    return s.raters ? t('avgOf', { n: s.raters }) + (s.zeros ? t('avgNoZero', { n: s.zeros }) : '') : t('noRating');
  }

  function renderPlace() {
    var p = placeById(state.placeId);
    if (!p) { goFeed(); return; }
    var c = catOf(p), s = stats(p), dist = haversine(XMUM, p);
    var link = safeURL(p.link);
    var coords = p.lat.toFixed(6) + ',' + p.lng.toFixed(6);
    var far = dist > 300000;
    var saved = store.isSaved(p.id);
    /* 像谷歌地图的地点卡片：名字下面一排按钮，导航是实心的，收藏、打分紧跟着，其余往右滑 */
    var actions = (far
      ? '<a class="btn" href="https://www.google.com/maps/search/?api=1&query=' + coords + '" target="_blank" rel="noopener">' + ICON.nav + esc(t('viewGoogle')) + '</a>'
      : '<a class="btn primary" href="https://www.google.com/maps/dir/?api=1&destination=' + coords + '" target="_blank" rel="noopener">' + ICON.nav + esc(t('navGoogle')) + '</a>') +
      '<button type="button" class="btn save-btn" data-action="toggle-save" aria-pressed="' + saved + '">' + (saved ? ICON.starOn + esc(t('wished')) : ICON.star + esc(t('wish'))) + '</button>' +
      '<button type="button" class="btn" data-action="write-review">' + ICON.pen + esc(t(p.mode === 'food' ? 'writeReview' : 'beenHere')) + '</button>' +
      (far ? '' : '<a class="btn" href="https://waze.com/ul?ll=' + coords + '&navigate=yes" target="_blank" rel="noopener">' + ICON.nav + esc(t('navWaze')) + '</a>');
    actions += '<button type="button" class="btn" data-action="copy-coords" data-c="' + coords + '">' + ICON.copy + esc(t('copyCoords')) + '</button>';
    if (link) actions += '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener nofollow">' + ICON.link + esc(t('openLink')) + '</a>';
    var photos = [];
    s.rs.forEach(function (r) { (r.photos || []).forEach(function (id) { photos.push(id); }); });
    photos = photos.slice(0, 12);
    var reviews = s.rs.slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
    var tags = '<span class="tag">' + catIconHTML(c) + esc(catName(c)) + '</span><span class="tag">' + esc(precLabel(p.precision)) + '</span>' +
      (p.mode === 'food' ? '<span class="tag">' + esc(t('tier_' + distTier(p))) + '</span>' : '') +
      '<span class="tag">' + esc(t('distFrom', { d: fmtDist(dist) })) + '</span>';

    var h = '<div class="view-top"><button type="button" class="icon-btn flat" data-action="back" aria-label="' + esc(t('back')) + '">' + ICON.back + '</button>' +
      (p.sample ? '<span class="badge">' + esc(t('sample')) + '</span>' : '') + '</div>' +
      '<div class="place-head"><h2>' + esc(placeTitle(p)) + '</h2>' +
      (placeSub(p) ? '<div class="alt">' + esc(placeSub(p)) + '</div>' : '') +
      '<div class="tags">' + tags + '</div></div>' +
      '<div class="actions place-actions">' + actions + '</div>' +
      /* 别人记过、我还没记的地方：直接在这里打分添加，不用再去搜 */
      (beenThere(p) ? '' : quickRateHTML('place-score', p.mode, false)) +
      (photos.length ? '<div class="photo-strip">' + photos.map(function (id) {
        return '<button type="button" class="ph" data-action="photo" data-id="' + esc(id) + '" data-group="place"><img data-photo="' + esc(id) + '" data-small alt=""></button>';
      }).join('') + '</div>' : '');
    /* 收藏了、还没人记录的地方：没有分数和点评，说一句就好 */
    if (!scopedReviews(p.id, 'saved').length) { view.innerHTML = h + '<p class="place-empty">' + esc(t('placeEmpty')) + '</p>'; return; }
    h += '<div class="stats">' +
      '<div class="stat"><b>' + (s.score != null ? '<span class="score-big" style="color:' + scoreColor(s.score) + '">' + fmtScore(s.score) + '</span>' : '—') + '</b><small>' + esc(scoreLabel(s)) + '</small></div>' +
      '<div class="stat"><b>' + (s.avgPrice ? 'RM ' + fmtPrice(s.avgPrice) : '—') + '</b><small>' + esc(t(p.mode === 'food' ? 'perPerson' : 'costLabel')) + '</small></div>' +
      '<div class="stat"><b>' + s.count + '</b><small>' + esc(t('reviewsLabel')) + '</small></div></div>';
    h += '<h3 class="sec-title">' + esc(t('reviewsTitle')) + '</h3><ul class="reviews">' + reviews.map(reviewHTML).join('') + '</ul>';
    view.innerHTML = h;
  }

  function reviewHTML(r) {
    var name = authorLabel(r), from = authorFrom(r), meta = metaHTML(r), text = reviewText(r);
    return '<li class="review">' + avatarHTML(name) + '<div class="rv-main">' +
      '<div class="rv-who"><b>' + esc(name) + '</b>' + (from ? '<span class="muted">' + esc(t('fromPrefix') + from) + '</span>' : '') + '<span class="fi-time">' + esc(timeAgo(r.createdAt)) + '</span></div>' +
      (meta ? '<div class="rv-meta">' + meta + '</div>' : '') +
      (text ? '<p class="rv-text">' + esc(text) + '</p>' : '') +
      (r.photos && r.photos.length ? '<div class="rv-photos">' + r.photos.map(function (id) {
        return '<button type="button" class="ph sm" data-action="photo" data-id="' + esc(id) + '" data-group="rv-' + esc(r.id) + '"><img data-photo="' + esc(id) + '" data-small alt=""></button>';
      }).join('') + '</div>' : '') +
      (isMine(r) ? '<div class="rv-actions"><button type="button" class="link-btn" data-action="edit-review" data-id="' + esc(r.id) + '">' + esc(t('edit')) + '</button>' +
        '<button type="button" class="link-btn danger" data-action="del-review" data-id="' + esc(r.id) + '">' + esc(t('del')) + '</button></div>' : '') +
      '</div></li>';
  }

  function fieldHTML(id, label, control) {
    return '<div class="field"><label class="f-label" for="' + id + '">' + label + '</label>' + control + '<div class="f-err" id="err-' + id + '" hidden></div></div>';
  }

  /* 新建地点，或者编辑自己建的地点时，表单里才有名称、分类、位置这些字段 */
  function formHasPlaceFields(f, p) {
    return !p || (!!f.editId && p.createdBy === me().id && !p.sample);
  }

  function renderForm() {
    var f = state.form;
    if (!f) { goFeed(); return; }
    var p = f.placeId ? placeById(f.placeId) : null;
    var isFood = (p ? p.mode : state.mode) === 'food';
    var placeFields = formHasPlaceFields(f, p);
    var share = f.visibility === 'public';
    var title = f.editId ? t('formEdit') : p ? t('formReview') : t(isFood ? 'formNewFood' : 'formNewTravel');
    /* 发布按钮放在顶部右边，不用滑到底才找得到 */
    var h = '<div class="view-top"><button type="button" class="icon-btn flat" data-action="form-cancel" aria-label="' + esc(t('back')) + '">' + ICON.back + '</button><h2 class="view-title">' + esc(title) + '</h2>' +
      '<button type="submit" form="place-form" class="btn primary small" id="f-submit">' + esc(t(f.editId ? 'saveEdit' : 'publish')) + '</button></div>' +
      '<form id="place-form" class="form" novalidate>';
    if (p && !placeFields) h += '<div class="form-place">' + catIconHTML(catOf(p)) + '<b>' + esc(placeTitle(p)) + '</b></div>';
    if (placeFields) {
      h += fieldHTML('f-name', esc(t('name')), '<input id="f-name" class="input" maxlength="60" placeholder="' + esc(t(isFood ? 'namePhFood' : 'namePhTravel')) + '">');
      h += '<div class="f-loc"><span>' + esc(t('location')) + '：' + f.loc.lat.toFixed(5) + ', ' + f.loc.lng.toFixed(5) + '</span><button type="button" class="link-btn" data-action="repick">' + esc(t('repick')) + '</button></div>';
      h += '<div class="field"><span class="f-label" id="lbl-cat">' + esc(t('category')) + '</span><div class="chips-wrap one-line" role="group" aria-labelledby="lbl-cat">' +
        CATS[state.mode].map(function (c) {
          return '<button type="button" class="chip" data-action="f-cat" data-cat="' + c.id + '" aria-pressed="' + (f.cat === c.id) + '">' + catIconHTML(c) + esc(catName(c)) + '</button>';
        }).join('') + '</div><p class="f-hint cat-guess" id="cat-guess" hidden></p></div>';
    }
    /* 只有评分必填，其余都是选填 */
    h += '<div class="field"><span class="f-label" id="lbl-rating">' + esc(t('rating')) + ' <small>· ' + esc(t('optional')) + '</small></span>' + starsInputHTML('f-rating', f.rating, 'form', 'lbl-rating') +
      '<p class="f-hint">' + esc(t('ratingHint')) + '</p><div class="f-err" id="err-rating" hidden></div></div>';
    h += fieldHTML('f-text', esc(t('review')), '<textarea id="f-text" class="input" rows="3" maxlength="1000" placeholder="' + esc(t(isFood ? 'reviewPhFood' : 'reviewPhTravel')) + '"></textarea>');
    h += '<div class="field"><span class="f-label">' + esc(t('photos')) + ' <small>· ' + esc(t('photoLimit', { n: MAX_PHOTOS })) + '</small></span><div class="photo-grid" id="f-photos"></div></div>';
    /* 人均只问吃的（筛选按人均）；旅行不问花费（用户 2026-10-26） */
    if (isFood) h += fieldHTML('f-price', esc(t('priceFood')), '<input id="f-price" class="input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="12">');
    /* 记录默认进“我的地图”，只问要不要分享到大地图 */
    h += '<button type="button" class="switch-row" role="switch" data-action="f-share" aria-checked="' + share + '">' +
      '<span class="sw-text"><b>' + esc(t('shareBig')) + '</b><small>' + esc(t('shareHint')) + '</small></span><span class="switch" aria-hidden="true"></span></button>';
    if (!me().name) h += '<div class="field" id="nick-field"' + (share ? '' : ' hidden') + '><label class="f-label" for="f-nick">' + esc(t('nickname')) + '</label><input id="f-nick" class="input" maxlength="20" autocomplete="nickname" placeholder="' + esc(t('nicknamePh')) + '"></div>';
    if (placeFields) {
      var d0 = f.draft || {};
      h += '<details class="more"' + (f.editId && (d0.alt || d0.link) ? ' open' : '') + '><summary>' + esc(t('formMore')) + '</summary><div class="more-body">' +
        '<div class="field"><span class="f-label" id="lbl-prec">' + esc(t('precision')) + '</span><div class="seg" role="group" aria-labelledby="lbl-prec">' +
        ['exact', 'area', 'city'].map(function (k) {
          return '<button type="button" data-action="f-prec" data-prec="' + k + '" aria-pressed="' + (f.precision === k) + '">' + esc(precLabel(k)) + '</button>';
        }).join('') + '</div><p class="f-hint">' + esc(t('precHint')) + '</p></div>' +
        fieldHTML('f-alt', esc(t('altName')), '<input id="f-alt" class="input" maxlength="60" placeholder="' + esc(t('altNamePh')) + '">') +
        fieldHTML('f-link', esc(t('link')), '<input id="f-link" class="input" type="url" inputmode="url" placeholder="' + esc(t('linkPh')) + '">') +
        '</div></details>';
    }
    h += '</form>';
    view.innerHTML = h;
    renderFormPhotos();
    restoreFormDraft();
    /* 分类只占一行，横着滑；预选的那个滑到看得见的地方 */
    var row = $('#place-form .chips-wrap.one-line'), sel = row && row.querySelector('[aria-pressed="true"]');
    if (sel) row.scrollLeft += sel.getBoundingClientRect().left - row.getBoundingClientRect().left - 18;
  }

  /* ================= place search [建议] =================

  /* ================= 谷歌地图搜索（Places UI Kit）[建议，用户 2026-10-27 给了密钥] =================

  /* 动图和短视频（用户 2026-10-28：动图可以，视频 5 秒以内）。
     动图原样存；视频在手机上重录成 720p、不带声音的 mp4（不支持的手机录成 webm），省空间也哪台手机都能放。
     都另做一张 jpg 小图，地图和列表用小图，点开才动 */
  var CLIP_MAX_SEC = 5, MEDIA_MAX_BYTES = 5 * 1024 * 1024;
  var MEDIA_TYPES = { gif: 'image/gif', mp4: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm' };

    return compressImage(file).then(function (out) {

        toast(t('gifTooBig'));

    });

  function frameJpeg(src, w, h, maxSide) {
    var scale = Math.min(1, maxSide / Math.max(w, h)), cv = document.createElement('canvas');
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);

        v.addEventListener(ev, function () { clearTimeout(tm); resolve(); }, { once: true });
        v.addEventListener('error', function () { clearTimeout(tm); reject(new Error('clipRead')); }, { once: true });

    v.src = src;
    return meta.then(function () {

      /* 有的手机不播就不给画面：先跳到 0.1 秒，不行再播一下 */
      var seeked = waitFor('seeked', 4000);

    var type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].filter(function (x) { return R.isTypeSupported(x); })[0];

  function mediaPhoto(out) {

    list.reduce(function (chain, file) {

  /* 分类预选（用户 2026-10-28，不接 AI 接口）：新地点、吃的、自己还没点过分类时
     1) 店名里有“寿司、拉面、奶茶”这类明确关键词 → 直接预选
