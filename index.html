<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雪团 XueTuan</title>
<meta name="description" content="雪团：厦马同学自己的吃喝玩乐地图。记录去过的地方、打分、拍照，收藏想去的地方。">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="only light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=ZCOOL+QingKe+HuangYou&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* Layout: full-bleed map with floating controls; one panel that is a bottom sheet on phones and a left column on desktop.
   Look: snow white with blue (雪团). Always light, even when the phone is in dark mode. Food is ice blue, travel a deeper blue. */
:root {
  --food: #2E7DCB;          /* ice blue */
  --travel: #4F63D8;        /* deep snow blue */
  --accent: var(--food);
  --accent-ink: #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --bg: #EEF4FA;
  --surface: #FFFFFF;
  --surface-2: #F1F6FB;
  --frost: rgba(255, 255, 255, .86);
  --ink: #1B2A3A;
  --muted: #687A8C;
  --line: #E3EBF3;
  --danger: #D2463F;
  --snow-shadow: 0 6px 24px rgba(40, 90, 140, .13), 0 1px 2px rgba(40, 90, 140, .08);
  --shadow: var(--snow-shadow);
  --font-ui: "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-display: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --sheet-peek: 138px;
  color-scheme: light;
}
/* 深色只在明确要的时候用（现在没有入口）；手机开了深色模式也保持蓝白 */
:root[data-theme="dark"] {
  --food: #6DB1F2; --travel: #8C9BF2; --accent-ink: #0B1520;
  --bg: #0B121A; --surface: #121B25; --surface-2: #1A2531; --frost: rgba(18, 27, 37, .86);
  --ink: #E6EEF6; --muted: #93A4B5; --line: #25313E;
  --shadow: 0 8px 26px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
html.mode-travel { --accent: var(--travel); }
/* 老一点的手机浏览器没有 color-mix：给浅色主题一个固定的浅底色 */
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  :root { --accent-soft: #E6F0FA; }
  html.mode-travel { --accent-soft: #E8EBFB; }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
a { color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
.maplibregl-canvas:focus-visible { outline: none; }
.muted { color: var(--muted); }
.frost { background: var(--frost); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); box-shadow: var(--shadow); }

/* ---------- shell ---------- */
/* 高度用 JS 量出来的真实可见高度（--app-h），不用 100vh / dvh：有些手机浏览器的地址栏、工具栏会让这两个值不准 */
.app { position: fixed; top: 0; top: var(--app-top, 0px); left: 0; right: 0; height: 100%; height: var(--app-h, 100%); overflow: hidden; }
/* 键盘弹起时收起标签栏，面板占满 */
html.kb-open { --tabbar: 0px; }
html.kb-open .tabbar { display: none; }
html.kb-open .panel { height: calc(var(--app-h, 100vh) - env(safe-area-inset-top, 0px) - 8px); }
/* 面板拉满时，地图右上角的按钮会从面板顶上露出一截，干脆藏起来 */
body[data-snap="full"] .map-ctrls { opacity: 0; pointer-events: none; }
.stage { position: absolute; top: 0; right: 0; bottom: 0; left: 0; --sheet-visible: 0px; }
/* 地球缩小时露出来的背景：飘雪的天空 */
#map {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  background-color: #E4EEF8;
  background-image:
    radial-gradient(2px 2px at 8% 14%, rgba(255,255,255,.95) 50%, transparent 60%),
    radial-gradient(1.6px 1.6px at 23% 72%, rgba(255,255,255,.9) 50%, transparent 60%),
    radial-gradient(2.4px 2.4px at 37% 26%, rgba(255,255,255,.95) 50%, transparent 60%),
    radial-gradient(1.6px 1.6px at 52% 90%, rgba(255,255,255,.85) 50%, transparent 60%),
    radial-gradient(2px 2px at 66% 10%, rgba(255,255,255,.95) 50%, transparent 60%),
    radial-gradient(1.6px 1.6px at 79% 64%, rgba(255,255,255,.9) 50%, transparent 60%),
    radial-gradient(2.6px 2.6px at 92% 33%, rgba(255,255,255,.95) 50%, transparent 60%),
    radial-gradient(1.6px 1.6px at 13% 47%, rgba(255,255,255,.8) 50%, transparent 60%),
    radial-gradient(1.4px 1.4px at 44% 56%, rgba(255,255,255,.8) 50%, transparent 60%),
    radial-gradient(2px 2px at 85% 87%, rgba(255,255,255,.9) 50%, transparent 60%),
    radial-gradient(1.4px 1.4px at 60% 38%, rgba(255,255,255,.8) 50%, transparent 60%),
    radial-gradient(ellipse 80% 70% at 50% 42%, #FBFDFF 0%, #E3EEF9 55%, #C9DDF1 100%);
}
.map-error {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 4; display: grid; place-items: center;
  padding: 24px; text-align: center; color: var(--ink); font-weight: 600; font-size: 15px;
}

/* ---------- map buttons (top right) ---------- */
.brand-badge {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #FFFFFF 0%, #EAF4FE 45%, #BCD9F5 100%);
  box-shadow: inset 0 -2px 4px rgba(46, 125, 203, .18), 0 1px 3px rgba(40, 90, 140, .18);
  color: #2E7DCB; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 14px; line-height: 1; letter-spacing: .02em;
}
/* 地图右上角：搜索、吃/玩切换（显示要切去的那个：吃的地图上是飞机）、筛选、点亮国家 */
.map-ctrls {
  position: absolute; z-index: 9; right: max(12px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  display: flex; flex-direction: column; gap: 8px;
}
.map-ctrls .icon-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; }
.map-ctrls .icon-btn svg { width: 18px; height: 18px; }
/* 全是蓝白：白底蓝图标；吃/玩切换用要切去的那张地图的蓝色（吃的地图上是深一点的蓝色飞机） */
.map-ctrls .search-btn, .map-ctrls .filter-btn, .map-ctrls .globe-btn { color: var(--accent); }
.map-ctrls .mode-btn { color: #fff; background: linear-gradient(145deg, #7D8EF2, #4A5BD0); box-shadow: 0 5px 14px rgba(79, 99, 216, .35); }
html.mode-travel .map-ctrls .mode-btn { background: linear-gradient(145deg, #5AA5EC, #2569B3); box-shadow: 0 5px 14px rgba(46, 125, 203, .35); }
.map-ctrls .filter-btn[aria-pressed="true"], .map-ctrls .globe-btn[aria-pressed="true"] { color: #fff; background: var(--accent); }
.map-ctrls .icon-btn b {
  position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink); font-size: 10px; line-height: 16px; text-align: center;
}
.map-ctrls .filter-btn[aria-pressed="true"] b, .map-ctrls .globe-btn b { background: #fff; color: var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.icon-btn {
  flex: none; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 12px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  display: grid; place-items: center;
}
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.flat { width: 32px; height: 32px; margin-left: -6px; border-radius: 50%; background: none; box-shadow: none; }
/* 手机上点过的东西会一直停在悬停状态，悬停底色只给有鼠标的设备 */
@media (hover: hover) { .icon-btn.flat:hover { background: var(--surface-2); } }

/* ---------- chips (filter sheet, forms) ---------- */
.chip {
  height: 30px; padding: 0 11px; border-radius: 999px; border: 0;
  background: none; color: var(--ink); font-size: 12.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
@media (hover: hover) { .chip:hover { background: var(--surface-2); } }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.chip svg { width: 15px; height: 15px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(40, 90, 140, .16); }
.form .seg { display: flex; }
.form .seg button { flex: 1; min-width: 0; padding: 0 8px; }

/* ---------- locate button + bottom tab bar ---------- */
:root { --tabbar: calc(50px + env(safe-area-inset-bottom, 0px)); }
.locate-btn {
  position: absolute; z-index: 9;
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--sheet-visible) + var(--tabbar) + 12px);
  width: 36px; height: 36px; border-radius: 50%;
  transition: bottom .34s cubic-bezier(.2, .8, .2, 1);
}
.locate-btn svg { width: 18px; height: 18px; }
.tabbar {
  position: absolute; z-index: 30; left: 0; right: 0; bottom: 0;
  height: var(--tabbar); padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: stretch;
  background: var(--surface); box-shadow: 0 -1px 0 var(--line), 0 -6px 20px rgba(40, 90, 140, .06);
}
.tab {
  min-width: 0; border: 0; background: none; padding: 5px 2px 3px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); font-size: 10px; font-weight: 600; line-height: 1.1;
}
.tab svg { width: 20px; height: 20px; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--accent); }
.tab-add { color: var(--ink); }
.tab-add-ic {
  width: 40px; height: 27px; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: background-color .3s, transform .15s;
}
.tab-add:active .tab-add-ic { transform: scale(.94); }
.tab-add-ic svg { width: 19px; height: 19px; }
.attrib {
  position: absolute; z-index: 8;
  left: max(8px, env(safe-area-inset-left, 0px));
  bottom: calc(var(--sheet-visible) + var(--tabbar) + 6px);
  max-width: calc(100% - 80px); padding: 1px 6px; border-radius: 6px;
  background: rgba(255, 255, 255, .6); color: #5A6B7C; font-size: 10px; line-height: 1.45;
  transition: bottom .34s cubic-bezier(.2, .8, .2, 1);
}
.attrib a { color: inherit; text-decoration: none; }
.attrib a:hover { text-decoration: underline; }
body.picking .tabbar, body.picking .map-ctrls, body.picking .locate-btn { display: none; }
body.picking .attrib { bottom: calc(env(safe-area-inset-bottom, 0px) + 122px); }

/* ---------- bottom sheets (filters, places) ---------- */
.bsheet { position: fixed; top: 0; right: 0; left: 0; bottom: auto; height: 100%; height: var(--app-h, 100%); z-index: 65; display: flex; align-items: flex-end; justify-content: center; background: rgba(20, 40, 60, .32); }
.bsheet-card {
  width: min(560px, 100%); max-height: 82vh; overflow-y: auto; overscroll-behavior: contain;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  border-radius: 24px 24px 0 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  animation: sheet-up .26s cubic-bezier(.2, .8, .2, 1);
}
@keyframes sheet-up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.bsheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0 4px; }
.bsheet-head h3 { margin: 0; font-size: 16px; font-weight: 800; }
.bsheet .field { margin-top: 14px; }
.bsheet-foot { position: sticky; bottom: -16px; display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 20px; padding: 10px 0 0; background: var(--surface); }
.bsheet-foot.single { grid-template-columns: 1fr; }
.area-opt {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 4px; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left; font-size: 14px; font-weight: 600; color: var(--ink);
}
.area-opt svg { flex: none; width: 18px; height: 18px; color: var(--accent); }
.area-opt.muted { color: var(--muted); font-weight: 500; }
.area-opt:last-child { border-bottom: 0; }

/* ---------- pick mode ---------- */
.pick { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 12; pointer-events: none; }
.pick-hint {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 12px;
  background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 600; text-align: center;
  box-shadow: var(--shadow);
}
.pick-pin { position: absolute; left: 50%; top: 50%; width: 46px; height: 58px; transform: translate(-50%, -100%); filter: drop-shadow(0 5px 6px rgba(20, 50, 80, .3)); animation: hover-pin 1.6s ease-in-out infinite; }
.pick-pin svg { width: 100%; height: 100%; display: block; }
.pick-pin path { fill: var(--accent); }
.pick-dot { position: absolute; left: 50%; top: 50%; width: 10px; height: 4px; margin: -2px 0 0 -5px; border-radius: 50%; background: rgba(20, 50, 80, .4); }
@keyframes hover-pin { 0%, 100% { transform: translate(-50%, -100%); } 50% { transform: translate(-50%, calc(-100% - 7px)); } }
.pick-bar {
  position: absolute; pointer-events: auto;
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  max-width: 460px; margin: 0 auto; padding: 12px; border-radius: 20px;
  background: var(--surface); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
}
.pick-prec { font-size: 13px; color: var(--muted); text-align: center; }
.pick-prec b { color: var(--ink); }
.pick-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }

/* ---------- panel (sheet on phones) ---------- */
.panel {
  position: absolute; z-index: 20; left: 0; right: 0; bottom: var(--tabbar);
  height: calc(100vh - var(--tabbar) - 64px);
  height: calc(var(--app-h, 100vh) - var(--tabbar) - env(safe-area-inset-top, 0px) - 64px);
  display: flex; flex-direction: column;
  background: var(--surface); border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 30px rgba(40, 90, 140, .16);
  transform: translateY(calc(100% - var(--visible, 96px)));
  transition: transform .34s cubic-bezier(.2, .8, .2, 1);
}
.panel.dragging { transition: none; }
.panel::after { content: ""; flex: none; height: var(--hidden, 0px); }
.grip { flex: none; height: 20px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grip span { width: 34px; height: 4px; border-radius: 2px; background: var(--line); }
.panel-brand { display: none; align-items: center; gap: 12px; padding: 20px 20px 14px; }
.brand-name { font-weight: 800; font-size: 17px; letter-spacing: -.01em; line-height: 1.2; }
.brand-name span { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin-right: 2px; color: var(--accent); }
.brand-tag { font-size: 12.5px; color: var(--muted); }
.panel-body {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) 20px max(18px, env(safe-area-inset-left, 0px));
}

/* ---------- views ---------- */
.title-row { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.view-title { margin: 0; font-size: 16.5px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.title-row .view-title { cursor: pointer; }
.count { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.sample-note {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 0; padding: 2px 0 6px; font-size: 12px; color: var(--muted);
}
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12.5px; font-weight: 700; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.link-btn.danger { color: var(--danger); }
.sample-note .link-btn { flex: none; white-space: nowrap; }
.top-cta { margin-left: auto; }
.mini-seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--surface-2); }
.mini-seg button { display: inline-flex; align-items: center; gap: 3px; }
.mini-seg button svg { width: 13px; height: 13px; }
.mini-seg button { height: 26px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); font-size: 12.5px; font-weight: 700; }
.mini-seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(40, 90, 140, .16); }
.feed, .reviews, .near-list, .search-results, .area-list { list-style: none; margin: 0; padding: 0; }
.feed-item {
  width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 11px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left;
}
.feed li:last-child .feed-item, .near-list li:last-child .near-item, .search-results li:last-child .near-item { border-bottom: 0; }
@media (hover: hover) { .feed-item:hover { background: var(--surface-2); } }
.avatar {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: hsl(var(--h, 200) 45% 58%); color: #fff; font-weight: 800; font-size: 13px;
}
.fi-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fi-who, .rv-who { min-width: 0; display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
.fi-who b, .rv-who b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi-who .muted, .rv-who .muted { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi-time { margin-left: auto; padding-left: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.fi-place { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; line-height: 1.35; }
.fi-meta, .rv-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.sep { opacity: .5; }
.fi-text { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
/* 列表里有照片的一条：照片放在左边代替头像（像美团的列表），多张时角上标张数 */
.feed-item.with-pic { grid-template-columns: 84px minmax(0, 1fr); }
.fi-pic { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.fi-pic img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
.fi-count {
  position: absolute; right: 4px; bottom: 4px; display: inline-flex; align-items: center; gap: 2px; height: 17px; padding: 0 5px;
  border-radius: 999px; background: rgba(10, 20, 30, .55); color: #fff; font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.fi-count svg { width: 11px; height: 11px; }
@media (max-width: 370px) { .feed-item.with-pic { grid-template-columns: 76px minmax(0, 1fr); } .fi-pic { width: 76px; height: 76px; } }
.row-pic { flex: none; width: 46px; height: 46px; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.row-pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.badge {

  function localStore() {
    var DATA_VERSION = 2;

    function emptyData() { return { version: DATA_VERSION, places: [], reviews: [], wishlist: [], profile: null, areas: [], seeded: false }; }

    /* v1 把“没打分”存成 0；v2 里 0 是合法分数，没打分改成 null */
    function migrate(d) {
      if ((d.version || 1) < 2) {
        (d.reviews || []).forEach(function (r) { if (!r.rating) r.rating = null; });
        d.version = 2;
      }
      return d;

          d.version = d.version || 1;
          data = migrate(Object.assign(emptyData(), d));
          ['places', 'reviews', 'wishlist', 'areas'].forEach(function (k) { if (!Array.isArray(data[k])) data[k] = []; });
        }
      } catch (e) { canPersist = false; }
    }
    function persist() {
      if (!canPersist) return false;
      try { localStorage.setItem(LS_DATA, JSON.stringify(data)); return true; }
      catch (e) { canPersist = false; toast(t('saveFail')); return false; }
    }
    var persistTimer = null;
    function persistSoon() { clearTimeout(persistTimer); persistTimer = setTimeout(persist, 400); }
    function done(v) { persist(); return Promise.resolve(v); }

    /* 示例数据改过一版（加了几十个地点和评分）。以前打开过的浏览器只补上缺的、填上分数；
       已经清空示例的不再加回来 */
    var SAMPLE_SET = 2;
    function seedSamples() {
      var cleared = data.seeded && !data.reviews.some(function (r) { return r.sample; });
      data.seeded = SAMPLE_SET;
      if (cleared) return;
      var now = Date.now();
      SAMPLES.forEach(function (s, i) {
        var ts = now - (SAMPLES.length - i) * 1000 * 60 * 60 * 7;
        var rating = s[10] == null ? null : s[10], price = s[11] || null;
        var old = find(data.reviews, 'r-' + s[0]);
        if (old) {
          if (old.sample && old.rating == null) { old.rating = rating; old.price = price; }
          return;
        }
        if (!find(data.places, s[0])) data.places.push({ id: s[0], mode: s[1], cat: s[2], precision: s[3], lat: s[4], lng: s[5], name: s[6], altName: s[7], link: '', osm: '', createdBy: 'sample', createdAt: ts, sample: true });
        data.reviews.push({ id: 'r-' + s[0], placeId: s[0], authorId: 'sample', authorName: '', authorFrom: '', rating: rating, price: price, text: s[8], textEn: s[9], photos: [], visibility: 'public', createdAt: ts, sample: true });
      });
    }
    function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
    function forgetPhoto(id) {
      [id, id + THUMB_KEY].forEach(function (k) {
        photoStore.del(k);
        var u = photoURLs.get(k);
        if (u) { URL.revokeObjectURL(u); photoURLs.delete(k); }
      });
    }
    /* photos: [{ id, blob, thumb, url }]，返回原图是否全部存进了 IndexedDB（小图存不进去就用原图） */
    function putPhotos(photos) {
      return Promise.all(photos.map(function (ph) {
        if (ph.url) photoURLs.set(ph.id, ph.url);
        if (ph.thumb) photoStore.put(ph.id + THUMB_KEY, ph.thumb);
        return photoStore.put(ph.id, ph.blob);
      })).then(function (oks) { return oks.every(Boolean); });
    }
    /* small：要小图；老照片没有小图就给原图 */
    function localPhotoURL(id, small) {
      var key = small ? id + THUMB_KEY : id;
      if (photoURLs.has(key)) return Promise.resolve(photoURLs.get(key));
      return photoStore.get(key).then(function (blob) {
        if (!blob) return small ? localPhotoURL(id, false) : null;
        var u = URL.createObjectURL(blob);
        photoURLs.set(key, u);
        return u;
      });
    }
    function dropPlaceIfEmpty(placeId) {
      if (data.reviews.some(function (r) { return r.placeId === placeId; })) return false;
      data.places = data.places.filter(function (p) { return p.id !== placeId; });
      data.wishlist = data.wishlist.filter(function (w) { return w.placeId !== placeId; });
      return true;
    }

    return {
      mode: 'local',
      signedIn: function () { return true; },
      email: function () { return ''; },
      onAuthChange: function () {},
      init: function () {
        load();
        if (!data.profile || !data.profile.id) data.profile = { id: uid('u'), name: '', country: '', region: '', city: '', district: '' };
        if (data.seeded !== SAMPLE_SET) seedSamples();
        persist();
        return Promise.resolve();
      },

      /* ---- 读 ---- */
      me: function () { return data.profile; },
      places: function () { return data.places; },
      place: function (id) { return find(data.places, id); },
      reviews: function () { return data.reviews; },
      review: function (id) { return find(data.reviews, id); },
      reviewsOf: function (placeId) { return data.reviews.filter(function (r) { return r.placeId === placeId; }); },
      areas: function () { return data.areas; },
      wishlist: function () { return data.wishlist; },
      isSaved: function (placeId) { return data.wishlist.some(function (w) { return w.placeId === placeId; }); },
      hasSamples: function () { return data.reviews.some(function (r) { return r.sample; }); },
      photoURL: localPhotoURL,
      hasPhotoURL: function (id) { return photoURLs.has(id); },

      /* ---- 写 ---- */
      addPlace: function (f) {
        var p = {
          id: uid('p'), mode: f.mode, cat: f.cat, precision: f.precision, lat: f.lat, lng: f.lng,
          name: f.name, altName: f.altName || '', link: f.link || '', osm: f.osm || '',
          createdBy: data.profile.id, createdAt: Date.now(), sample: false
        };
        data.places.push(p);
        return done(p);
      },
      updatePlace: function (id, patch) {
        var p = find(data.places, id);
        if (!p || p.createdBy !== data.profile.id) return Promise.reject(new Error('not yours'));
        ['cat', 'precision', 'lat', 'lng', 'name', 'altName', 'link'].forEach(function (k) { if (patch[k] !== undefined) p[k] = patch[k]; });
        p.updatedAt = Date.now();
        return done(p);
      },
      /* f: { placeId, rating, price, text, visibility }，newPhotos: [{ id, blob, url }] */
      addReview: function (f, newPhotos) {
        var me = data.profile;
        var r = {
          id: uid('r'), placeId: f.placeId, authorId: me.id, authorName: me.name || '', authorFrom: shortFrom(me),
          rating: f.rating, price: f.price, text: f.text, photos: newPhotos.map(function (ph) { return ph.id; }),
          visibility: f.visibility, createdAt: Date.now(), sample: false
        };
        return putPhotos(newPhotos).then(function (photosOk) {
          data.reviews.push(r);
          persist();
          return { review: r, photosOk: photosOk };
        });
      },
      /* patch 同 addReview；keepPhotos 是保留的旧照片 id，newPhotos 是新加的 */
      updateReview: function (id, patch, keepPhotos, newPhotos) {
        var r = find(data.reviews, id);
        if (!r || r.authorId !== data.profile.id) return Promise.reject(new Error('not yours'));
        return putPhotos(newPhotos).then(function (photosOk) {
          (r.photos || []).forEach(function (pid) { if (keepPhotos.indexOf(pid) === -1) forgetPhoto(pid); });
          ['rating', 'price', 'text', 'visibility'].forEach(function (k) { if (patch[k] !== undefined) r[k] = patch[k]; });
          r.photos = keepPhotos.concat(newPhotos.map(function (ph) { return ph.id; }));
          r.authorName = data.profile.name || '';
          r.authorFrom = shortFrom(data.profile);
          r.updatedAt = Date.now();
          persist();
          return { review: r, photosOk: photosOk };
        });
      },
      /* 删掉最后一条记录时地点也一起删，返回 { placeRemoved } */
      deleteReview: function (id) {
        var r = find(data.reviews, id);
        if (!r || r.authorId !== data.profile.id) return Promise.reject(new Error('not yours'));
        data.reviews = data.reviews.filter(function (x) { return x.id !== id; });
        (r.photos || []).forEach(forgetPhoto);
        return done({ placeRemoved: dropPlaceIfEmpty(r.placeId) });
      },
      setSaved: function (placeId, saved) {
        data.wishlist = data.wishlist.filter(function (w) { return w.placeId !== placeId; });
        if (saved) data.wishlist.push({ placeId: placeId, createdAt: Date.now() });
        return done(saved);
      },
      updateProfile: function (patch) {
        Object.keys(patch).forEach(function (k) { data.profile[k] = patch[k]; });
        persistSoon();
        return Promise.resolve(data.profile);
      },
      addArea: function (a) {
        var area = { id: uid('a'), name: a.name, lng: a.lng, lat: a.lat, zoom: a.zoom };
        data.areas.push(area);
        return done(area);
      },
      deleteArea: function (id) {
        data.areas = data.areas.filter(function (x) { return x.id !== id; });
        return done();
      },
      clearSamples: function () {
        data.reviews = data.reviews.filter(function (r) { return !r.sample; });
        data.places = data.places.filter(function (p) { return !p.sample; });
        data.wishlist = data.wishlist.filter(function (w) { return find(data.places, w.placeId); });
        data.seeded = true;
        return done();
      },

      /* ---- 备份 ---- */
      exportBackup: function () {
        var ids = [], photos = {};
        data.reviews.forEach(function (r) { (r.photos || []).forEach(function (id) { ids.push(id); }); });
        return ids.reduce(function (chain, id) {
          return chain.then(function () {
            return photoStore.get(id).then(function (b) { return b ? blobToDataURL(b) : null; }).then(function (u) { if (u) photos[id] = u; });
          });
        }, Promise.resolve()).then(function () {
          return {
            app: BACKUP_APP, version: DATA_VERSION, exportedAt: new Date().toISOString(),
            profile: data.profile, places: data.places, reviews: data.reviews, wishlist: data.wishlist, areas: data.areas, photos: photos
          };
        });
      },
      /* 合并导入，已有的 id 不覆盖。返回新增地点数；格式不对返回 -1 */
      importBackup: function (obj) {
        if (!obj || BACKUP_APPS.indexOf(obj.app) === -1 || !Array.isArray(obj.places) || !Array.isArray(obj.reviews)) return Promise.resolve(-1);
        migrate(obj);
        var placeIds = {}, reviewIds = {}, areaIds = {}, added = 0;
        data.places.forEach(function (p) { placeIds[p.id] = 1; });
        data.reviews.forEach(function (r) { reviewIds[r.id] = 1; });
        data.areas.forEach(function (a) { areaIds[a.id] = 1; });
        obj.places.forEach(function (p) { if (p && p.id && !placeIds[p.id] && isFinite(p.lat) && isFinite(p.lng) && CATS[p.mode]) { data.places.push(p); added++; } });
        obj.reviews.forEach(function (r) { if (r && r.id && !reviewIds[r.id] && r.placeId) data.reviews.push(r); });
        (obj.areas || []).forEach(function (a) { if (a && a.id && !areaIds[a.id]) data.areas.push(a); });
        (obj.wishlist || []).forEach(function (w) { if (w && w.placeId && !data.wishlist.some(function (x) { return x.placeId === w.placeId; })) data.wishlist.push(w); });
        var me = data.profile;
        if (obj.profile && obj.profile.id && !me.name && !data.reviews.some(function (r) { return r.authorId === me.id; })) data.profile = obj.profile;
        var jobs = Object.keys(obj.photos || {}).map(function (id) {
          return dataURLToBlob(obj.photos[id]).then(function (b) { return photoStore.put(id, b); }).catch(function () { return false; });
        });
        return Promise.all(jobs).then(function () { persist(); return added; });
      }
    };
  }

  /* ================= remote store (Supabase) =================
   * 和 localStore 一样的接口。init() 把看得见的数据（RLS 已经过滤好）拉进内存缓存，
   * 读还是同步的；写先调接口，成功后再改缓存。
   * 没登录时只能看：me().id 是 null，所有写操作都会被拒绝，界面会先让人登录。
   */
  function remoteStore(client) {
    var ANON = { id: null, name: '', country: '', region: '', city: '', district: '' };
    var cache = { places: [], reviews: [], wishlist: [], profile: ANON };
    var session = null, email = '';
    var photoURLs = new Map();
    var listeners = [];

    function uidNow() { return session ? session.user.id : null; }
    function ok(res) { if (res.error) throw res.error; return res.data; }
    function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
    function needLogin() { return uidNow() ? null : Promise.reject(new Error('login required')); }

    function placeFromRow(r) {
      return {
        id: r.id, mode: r.mode, cat: r.cat, precision: r.precision, lat: r.lat, lng: r.lng,
        name: r.name, altName: r.alt_name, link: r.link, osm: r.osm, createdBy: r.created_by,
        createdAt: Date.parse(r.created_at), sample: false
      };
    }
    function placeToRow(p) {
      var row = {};
      [['mode', 'mode'], ['cat', 'cat'], ['precision', 'precision'], ['lat', 'lat'], ['lng', 'lng'], ['name', 'name'],
        ['altName', 'alt_name'], ['link', 'link'], ['osm', 'osm']].forEach(function (k) { if (p[k[0]] !== undefined) row[k[1]] = p[k[0]]; });
      return row;
    }
    function reviewFromRow(r, author) {
      author = author || r.author || {};
      return {
        id: r.id, placeId: r.place_id, authorId: r.user_id, authorName: author.name || '', authorFrom: shortFrom(author),
        rating: r.rating, price: r.price == null ? null : +r.price, text: r.text, photos: r.photos || [],
        visibility: r.visibility, createdAt: Date.parse(r.created_at), sample: false
      };
    }
    function photoPath(id) { return uidNow() + '/' + id + '.jpg'; }
    /* 小图和原图放在同一个文件夹：xxx.jpg 的小图是 xxx_t.jpg */
    function thumbPath(path) { return path.replace(/\.jpg$/, '_t.jpg'); }
    /* 传照片（原图 + 小图），返回传成功的路径和是否全部成功；小图传不上去就算了，显示时会退回原图 */
    function uploadPhotos(photos) {
      var bucket = client.storage.from('photos');
      return Promise.all(photos.map(function (ph) {
        var path = photoPath(ph.id);
        return bucket.upload(path, ph.blob, { contentType: 'image/jpeg', upsert: false }).then(function (res) {
          if (res.error) return null;
          if (ph.url) photoURLs.set(path, ph.url);
          if (!ph.thumb) return path;
          photoURLs.set(path + THUMB_KEY, URL.createObjectURL(ph.thumb));
          return bucket.upload(thumbPath(path), ph.thumb, { contentType: 'image/jpeg', upsert: false }).then(function () { return path; }, function () { return path; });
        }, function () { return null; });
      })).then(function (paths) {
        var good = paths.filter(Boolean);
        return { paths: good, ok: good.length === photos.length };
      });
    }
    function removePhotos(paths) {
      if (!paths.length) return Promise.resolve();
      paths.forEach(function (p) { photoURLs.delete(p); photoURLs.delete(p + THUMB_KEY); });
      return client.storage.from('photos').remove(paths.concat(paths.map(thumbPath))).then(function () {}, function () {});
    }

    function loadAll() {
      var uid = uidNow();
      return Promise.all([
        client.from('places').select('*').limit(10000),
        client.from('visits').select('*, author:profiles(name, country, region, city, district)').order('created_at', { ascending: false }).limit(10000),
        uid ? client.from('profiles').select('*').eq('id', uid).maybeSingle() : Promise.resolve({ data: null }),
        uid ? client.from('wishlist').select('*') : Promise.resolve({ data: [] })
      ]).then(function (res) {
        var places = ok(res[0]), visits = ok(res[1]), profile = ok(res[2]), wish = ok(res[3]);
        cache.places = places.map(placeFromRow);
        cache.reviews = visits.map(function (v) { return reviewFromRow(v); });
        cache.profile = uid ? Object.assign({}, ANON, profile || {}, { id: uid }) : ANON;
        cache.wishlist = (wish || []).map(function (w) { return { placeId: w.place_id, createdAt: Date.parse(w.created_at) }; });
      });
    }
    function setSession(s) {
      var before = uidNow();
      session = s;
      email = s && s.user ? s.user.email || '' : '';
      return before !== uidNow();
    }

    var profileTimer = null, profilePatch = {};
    function flushProfile() {
      var patch = profilePatch, uid = uidNow();
      profilePatch = {};
      if (!uid || !Object.keys(patch).length) return Promise.resolve();
      return client.from('profiles').update(patch).eq('id', uid).then(function (res) {
        if (res.error) toast(t('saveFail'));
      });
    }

    var areas = {
      list: function () { try { return JSON.parse(localStorage.getItem(LS_AREAS) || '[]'); } catch (e) { return []; } },
      save: function (list) { try { localStorage.setItem(LS_AREAS, JSON.stringify(list)); } catch (e) { /* 存不了就算了 */ } }
    };
    var areaCache = areas.list();

    return {
      mode: 'remote',
      init: function () {
        client.auth.onAuthStateChange(function (event, s) {
          // 回调里不能直接再调 supabase，放到下一轮
          setTimeout(function () {
            if (!setSession(s)) return;
            loadAll().then(function () { listeners.forEach(function (fn) { fn(); }); });
          }, 0);
        });
        return client.auth.getSession().then(function (res) {
          setSession(res.data && res.data.session);
          return loadAll();
        });
      },

      /* ---- 账号 ---- */
      signedIn: function () { return !!uidNow(); },
      email: function () { return email; },
      onAuthChange: function (fn) { listeners.push(fn); },
      signInWithEmail: function (addr) {
        return client.auth.signInWithOtp({ email: addr, options: { emailRedirectTo: location.origin + location.pathname } }).then(ok);
      },
      signInWithGoogle: function () {
        return client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }).then(ok);
      },
      signOut: function () { return client.auth.signOut().then(ok); },

      /* ---- 读 ---- */
      me: function () { return cache.profile; },
      places: function () { return cache.places; },
      place: function (id) { return find(cache.places, id); },
      reviews: function () { return cache.reviews; },
      review: function (id) { return find(cache.reviews, id); },
      reviewsOf: function (placeId) { return cache.reviews.filter(function (r) { return r.placeId === placeId; }); },
      areas: function () { return areaCache; },
      wishlist: function () { return cache.wishlist; },
      isSaved: function (placeId) { return cache.wishlist.some(function (w) { return w.placeId === placeId; }); },
      hasSamples: function () { return false; },
      /* small：小图地址。以前传的照片没有小图，图片加载失败时由显示的地方退回原图 */
      photoURL: function (id, small) {
        var key = small ? id + THUMB_KEY : id;
        if (photoURLs.has(key)) return Promise.resolve(photoURLs.get(key));
        if (id.indexOf('/') === -1) return photoStore.get(id).then(function (b) { return b ? URL.createObjectURL(b) : null; });
        var u = client.storage.from('photos').getPublicUrl(small ? thumbPath(id) : id).data.publicUrl;
        photoURLs.set(key, u);
        return Promise.resolve(u);
      },
      hasPhotoURL: function (id) { return photoURLs.has(id); },

      /* ---- 写 ---- */
      addPlace: function (f) {
        return needLogin() || client.from('places').insert(placeToRow(f)).select().single().then(ok).then(function (row) {
          var p = placeFromRow(row);
          cache.places.push(p);
          return p;
        });
      },
      updatePlace: function (id, patch) {
        var row = placeToRow(patch);
        delete row.mode;
        return needLogin() || client.from('places').update(row).eq('id', id).select().single().then(ok).then(function (r) {
          var p = find(cache.places, id);
          Object.assign(p, placeFromRow(r));
          return p;
        });
      },
      addReview: function (f, newPhotos) {
        return needLogin() || uploadPhotos(newPhotos).then(function (up) {
          var row = { place_id: f.placeId, rating: f.rating, price: f.price, text: f.text, visibility: f.visibility, photos: up.paths };
          return client.from('visits').insert(row).select().single().then(ok).then(function (v) {
            var r = reviewFromRow(v, cache.profile);
            cache.reviews.unshift(r);
            return { review: r, photosOk: up.ok };
          });
        });
      },
      updateReview: function (id, patch, keepPhotos, newPhotos) {
        var r = find(cache.reviews, id);
        if (!r) return Promise.reject(new Error('missing'));
        return needLogin() || uploadPhotos(newPhotos).then(function (up) {
          var dropped = (r.photos || []).filter(function (p) { return keepPhotos.indexOf(p) === -1; });
          var row = { rating: patch.rating, price: patch.price, text: patch.text, visibility: patch.visibility, photos: keepPhotos.concat(up.paths) };
          return client.from('visits').update(row).eq('id', id).select().single().then(ok).then(function (v) {
            removePhotos(dropped);
            Object.assign(r, reviewFromRow(v, cache.profile));
            return { review: r, photosOk: up.ok };
          });
        });
      },
      /* 删最后一条记录时数据库会顺带删地点；删完查一下地点还在不在（或者我还看不看得见） */
      deleteReview: function (id) {
        var r = find(cache.reviews, id);
        if (!r) return Promise.reject(new Error('missing'));
        return needLogin() || client.from('visits').delete().eq('id', id).then(ok).then(function () {
          removePhotos(r.photos || []);
          cache.reviews = cache.reviews.filter(function (x) { return x.id !== id; });
          return client.from('places').select('id').eq('id', r.placeId).then(ok);
        }).then(function (rows) {
          var gone = !rows.length;
          if (gone) {
            cache.places = cache.places.filter(function (p) { return p.id !== r.placeId; });
            cache.wishlist = cache.wishlist.filter(function (w) { return w.placeId !== r.placeId; });
          }
          return { placeRemoved: gone };
        });
      },
      setSaved: function (placeId, saved) {
        var q = saved
          ? client.from('wishlist').insert({ place_id: placeId })
          : client.from('wishlist').delete().eq('place_id', placeId).eq('user_id', uidNow());
        return needLogin() || q.then(ok).then(function () {
          cache.wishlist = cache.wishlist.filter(function (w) { return w.placeId !== placeId; });
          if (saved) cache.wishlist.push({ placeId: placeId, createdAt: Date.now() });
          return saved;
        });
      },
      updateProfile: function (patch) {
        if (!uidNow()) return Promise.reject(new Error('login required'));
        Object.keys(patch).forEach(function (k) { cache.profile[k] = patch[k]; profilePatch[k] = patch[k]; });
        cache.reviews.forEach(function (r) {
          if (r.authorId === uidNow()) { r.authorName = cache.profile.name || ''; r.authorFrom = shortFrom(cache.profile); }
        });
        clearTimeout(profileTimer);
        profileTimer = setTimeout(flushProfile, 400);
        return Promise.resolve(cache.profile);
      },
      addArea: function (a) {
        var area = { id: uid('a'), name: a.name, lng: a.lng, lat: a.lat, zoom: a.zoom };
        areaCache.push(area);
        areas.save(areaCache);
        return Promise.resolve(area);
      },
      deleteArea: function (id) {
        areaCache = areaCache.filter(function (x) { return x.id !== id; });
        areas.save(areaCache);
        return Promise.resolve();
      },
      clearSamples: function () { return Promise.resolve(); },

      /* ---- 备份 ----
       * 导出：我自己的记录和它们的地点（照片是网址，不打包）。
       * 导入：把备份里的记录当成我的，上传到账号。用来把本地版存的东西搬上来。
       */
      exportBackup: function () {
        var mine = cache.reviews.filter(function (r) { return r.authorId === uidNow(); });
        var ids = {};
        mine.forEach(function (r) { ids[r.placeId] = 1; });

        return { type: 'Feature', geometry: f.geometry, properties: { v: lit[i] ? 1 : 0, name: (f.properties && f.properties.name) || '' } };
      }) };
      if (src) src.setData(data);
      else addCountryLayers(data);
      world.litKey = key;
    }
    COUNTRY_LAYERS.forEach(function (id) { map.setLayoutProperty(id, 'visibility', 'visible'); });
  }
  function addCountryLayers(data) {
    map.addSource('countries', { type: 'geojson', data: data });
    var fade = function (a) { return ['interpolate', ['linear'], ['zoom'], 3, a, 5.5, a * 0.8, 7, 0]; };
    map.addLayer({ id: 'ct-dim', type: 'fill', source: 'countries', maxzoom: 8, filter: ['==', ['get', 'v'], 0],
      paint: { 'fill-color': '#0B1626', 'fill-opacity': fade(0.5) } }, 'pt-area');
    map.addLayer({ id: 'ct-lit', type: 'fill', source: 'countries', maxzoom: 8, filter: ['==', ['get', 'v'], 1],
      paint: { 'fill-color': '#FFC23D', 'fill-opacity': fade(0.55) } }, 'pt-area');
    map.addLayer({ id: 'ct-line', type: 'line', source: 'countries', maxzoom: 8, filter: ['==', ['get', 'v'], 1],
      paint: { 'line-color': '#F29D00', 'line-width': 1.4, 'line-opacity': fade(0.9) } }, 'pt-area');
  }

  /* ================= bottom sheets: 筛选、去哪儿看 ================= */
  function openBSheet(kind) { state.bsheet = kind; renderBSheet(); $('#bsheet').hidden = false; syncNavGuard(); }
  function closeBSheet() { state.bsheet = null; $('#bsheet').hidden = true; $('#bsheet-card').innerHTML = ''; syncNavGuard(); }
  function optHTML(action, v, on, label) {
    return '<button type="button" class="chip" data-action="' + action + '" data-v="' + v + '" aria-pressed="' + on + '">' + esc(label) + '</button>';
  }
  function renderBSheet() {
    var card = $('#bsheet-card'), h = '';
    if (state.bsheet === 'filters') {
      var food = state.mode === 'food', mine = state.scope === 'mine';
      var shown = store.places().filter(function (p) { return inScope(p) && passesFilters(p); }).length;
      h += '<div class="bsheet-head"><h3>' + esc(t('filtersTitle')) + '</h3></div>';
      if (mine) {
        h += '<div class="field"><span class="f-label">' + esc(t('mineShow')) + '</span><div class="chips-wrap">' +
          ['food', 'travel', 'both'].map(function (v) { return '<button type="button" class="chip" data-action="mine-mode" data-v="' + v + '" aria-pressed="' + (mineView() === v) + '">' + esc(t('mine_' + v)) + '</button>'; }).join('') + '</div></div>';
      } else {
        if (state.scope === 'saved') {
          h += '<div class="field"><span class="f-label">' + esc(t('savedShow')) + '</span><div class="chips-wrap">' +
            ['all', 'want'].map(function (v) { return optHTML('saved-want', v, (v === 'want') === state.savedWant, t(v === 'want' ? 'savedWant' : 'savedAll')); }).join('') + '</div></div>';
        }
        h += '<div class="field"><span class="f-label">' + esc(t('filterCat')) + '</span><div class="chips-wrap">' +
          '<button type="button" class="chip" data-action="cat" data-cat="all" aria-pressed="' + (state.cat === 'all') + '">' + esc(t('catAll')) + '</button>' +
          CATS[state.mode].map(function (c) {
            return '<button type="button" class="chip" data-action="cat" data-cat="' + c.id + '" aria-pressed="' + (state.cat === c.id) + '">' + catIconHTML(c) + esc(catName(c)) + '</button>';
          }).join('') + '</div></div>';
        h += '<div class="field"><span class="f-label">' + esc(t('filterScore')) + '<span class="legend" aria-hidden="true"><b>0</b><i></i><b>5</b></span></span><div class="chips-wrap">' +
          SCORE_STEPS.map(function (n) { return optHTML('set-score', n, state.minScore === n, n ? t('scoreOpt', { n: n }) : t('anyOpt')); }).join('') + '</div></div>';
        if (food) {
          h += '<div class="field"><span class="f-label">' + esc(t('filterDist')) + '</span><div class="chips-wrap">' +
            DIST_STEPS.map(function (d) { return optHTML('set-dist', d, state.dist === d, d === 'any' ? t('anyOpt') : t('dist_' + d)); }).join('') + '</div></div>';
          h += '<div class="field"><span class="f-label">' + esc(t('filterPrice')) + '</span><div class="chips-wrap">' +
            PRICE_STEPS.map(function (n) { return optHTML('set-price', n, state.priceMax === n, n ? t('priceOpt', { n: n }) : t('anyOpt')); }).join('') + '</div></div>';
        }
      }
      h += '<div class="bsheet-foot' + (mine ? ' single' : '') + '">' + (mine ? '' : '<button type="button" class="btn ghost" data-action="clear-filters">' + esc(t('filterReset')) + '</button>') +
        '<button type="button" class="btn primary" data-action="sheet-close">' + esc(t('filterShow', { n: shown })) + '</button></div>';
    }
    card.innerHTML = h;
  }
  /* 常去的地方：搜索框还没输字时列在搜索页里 */
  function areasHTML() {
    var pin = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22c-.4 0-7-6.6-7-12a7 7 0 0 1 14 0c0 5.4-6.6 12-7 12zm0-9.2a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6z"/></svg>';
    var li = function (inner) { return '<li>' + inner + '</li>'; };
    var h = '<li class="sec-title">' + esc(t('areasTitle')) + '</li>';
    h += li('<button type="button" class="area-opt" data-action="locate">' + ICON.nav + esc(t('locate')) + '</button>');
    PRESET_AREAS.forEach(function (a) { h += li('<button type="button" class="area-opt" data-action="goto-area" data-id="' + esc(a.id) + '">' + pin + esc(state.lang === 'en' ? a.en : a.zh) + '</button>'); });
    store.areas().forEach(function (a) { h += li('<button type="button" class="area-opt" data-action="goto-area" data-id="' + esc(a.id) + '">' + pin + esc(a.name) + '</button>'); });
    h += li('<button type="button" class="area-opt muted" data-action="save-area">＋ ' + esc(t('saveHere')) + '</button>');

  /* ================= views ================= */
  function render() {
    var v = state.view;
    if (v === 'feed') renderFeed();
    else if (v === 'place') renderPlace();
    else if (v === 'form') renderForm();
    else if (v === 'nearby') renderNearby();
    else if (v === 'search') renderSearch();
    else if (v === 'add') renderAdd();
    else if (v === 'preview') renderPreview();
    else if (v === 'profile') renderProfile();
    else if (v === 'login') renderLogin();
    if (lastRenderedView !== v) view.scrollTop = 0;
    lastRenderedView = v;
    updateSelPin();
    updateSelection();
    renderTabs();
    hydratePhotos(view);
    if (state.snap === 'peek') applySnap();
    syncNavGuard();
  }

  /* 带 data-small 的用小图，小图打不开（以前传的照片没有小图）就换原图 */
  function hydratePhotos(root) {
    $$('img[data-photo]', root).forEach(function (img) {
      var id = img.dataset.photo, small = img.hasAttribute('data-small');
      function missing() { if (img.parentElement) img.parentElement.classList.add('missing'); }
      store.photoURL(id, small).then(function (u) {
        if (!u) { missing(); return; }
        img.onerror = !small ? missing : function () {
          img.onerror = missing;
          store.photoURL(id).then(function (full) { if (full && full !== u) img.src = full; else missing(); });
        };
        img.src = u;
      });
    });
  }

  function feedReviews() {
    return store.reviews().filter(function (r) {
      var p = placeById(r.placeId);
      if (!p || !modeOk(p)) return false;
      if (state.scope === 'mine' ? !isMine(r) : r.visibility !== 'public') return false;
      return passesFilters(p);
    }).sort(function (a, b) { return b.createdAt - a.createdAt; }).slice(0, 80);
  }
  function savedPlaces() {
    return store.wishlist().slice().sort(function (a, b) { return b.createdAt - a.createdAt; })
      .map(function (w) { return placeById(w.placeId); })
      .filter(function (p) { return p && p.mode === state.mode && visibleToMe(p) && !(state.savedWant && beenThere(p)) && passesFilters(p); });
  }

  function renderFeed() {
    var saved = state.scope === 'saved';
    var items = saved ? savedPlaces() : feedReviews();
    var key = {
      food: { all: 'feedFoodAll', mine: 'feedFoodMine', saved: 'feedSavedFood' },
      travel: { all: 'feedTravelAll', mine: 'feedTravelMine', saved: 'feedSavedTravel' }
    }[state.mode][state.scope];
    if (state.scope === 'mine' && state.mineBoth) key = 'feedBothMine';
    var h = '<div class="view-head"><div class="title-row"><h2 class="view-title" data-action="expand">' + esc(t(key)) + '</h2><span class="count">' + items.length + '</span>' +
      (state.scope !== 'all' ? '<span class="mini-seg top-cta" role="group">' + ['mine', 'saved'].map(function (v) {
        return '<button type="button" data-action="mine-sub" data-v="' + v + '" aria-pressed="' + (state.scope === v) + '">' + (v === 'saved' ? ICON.star : '') + esc(t(v === 'saved' ? 'subSaved' : 'subBeen')) + '</button>';
      }).join('') + '</span>' : '') + '</div></div>';
    if (store.hasSamples() && state.scope === 'all') {
      h += '<div class="sample-note"><span>' + esc(t('samplesShown')) + '</span><button type="button" class="link-btn" data-action="clear-samples">' + esc(t('clearSamples')) + '</button></div>';
    }
    if (!items.length) h += emptyHTML();
    else if (saved) h += '<ul class="near-list">' + items.map(savedItemHTML).join('') + '</ul>';
    else h += '<ul class="feed">' + items.map(feedItemHTML).join('') + '</ul>';
    view.innerHTML = h;
  }

  function metaHTML(r) {
    var parts = [];
    if (r.rating != null) parts.push(scoreHTML(r.rating));
    if (r.price) parts.push('<span>RM ' + fmtPrice(r.price) + '</span>');
    if (r.visibility === 'private') parts.push('<span class="pill">' + esc(t('visPrivateShort')) + '</span>');
    return parts.join('<span class="sep">·</span>');
  }

  /* 列表一条：有照片时第一张照片放在左边代替头像，多张时角上标张数；点进去看大图 */
  function feedItemHTML(r) {
    var p = placeById(r.placeId), c = catOf(p);
    var name = authorLabel(r), from = authorFrom(r), meta = metaHTML(r), text = reviewText(r);
    var n = r.photos ? r.photos.length : 0;
    var lead = n ? '<span class="fi-pic"><img data-photo="' + esc(r.photos[0]) + '" data-small alt="">' +
      (n > 1 ? '<span class="fi-count">' + ICON.camera + n + '</span>' : '') + '</span>' : avatarHTML(name);
    return '<li><button type="button" class="feed-item' + (n ? ' with-pic' : '') + '" data-action="open-place" data-id="' + esc(p.id) + '">' +
      lead +
      '<span class="fi-main">' +
      '<span class="fi-who"><b>' + esc(name) + '</b>' + (from ? '<span class="muted">' + esc(t('fromPrefix') + from) + '</span>' : '') + '<span class="fi-time">' + esc(timeAgo(r.createdAt)) + '</span></span>' +
      '<span class="fi-place">' + catIconHTML(c) + '<span>' + esc(placeTitle(p)) + '</span>' + (p.sample ? '<span class="badge">' + esc(t('sample')) + '</span>' : '') + '</span>' +
      (meta ? '<span class="fi-meta">' + meta + '</span>' : '') +
      (text ? '<span class="fi-text">' + esc(text) + '</span>' : '') +
      '</span></button></li>';
  }

  /* 地点一行：搜索结果、附近已有、收藏列表都用这个。sub 和 right 是已经转义好的 HTML */
  function placeRowHTML(p, action, sub, right) {
    var photo = coverPhoto(p, 'saved');
    var lead = photo ? '<span class="row-pic"><img data-photo="' + esc(photo) + '" data-small alt=""></span>' : catIconHTML(catOf(p));
    return '<li><button type="button" class="near-item" data-action="' + action + '" data-id="' + esc(p.id) + '">' + lead +
      '<span class="near-text"><b>' + esc(placeTitle(p)) + '</b><small>' + sub + '</small></span>' + (right || '') + '</button></li>';
  }
  function savedItemHTML(p) {
    var s = stats(p);
    var sub = esc(catName(catOf(p))) + ' · ' + esc(t('distFrom', { d: fmtDist(haversine(XMUM, p)) }));
    return placeRowHTML(p, 'open-place', sub, s.score != null ? scoreHTML(s.score) : '<span class="near-cta muted">' + esc(t('noRating')) + '</span>');
  }

  /* 空的时候只给一行小字 + 一个文字按钮 */
  function emptyHTML() {
    var filtered = filtersActive();
    var msg = filtered ? t('emptyFiltered')
      : state.scope === 'mine' ? t('emptyMine')
      : state.scope === 'saved' ? t(state.savedWant && store.wishlist().length ? 'emptyWant' : 'emptySaved')
      : t(state.mode === 'food' ? 'emptyFoodAll' : 'emptyTravelAll');
    var btn = filtered
      ? '<button type="button" class="link-btn" data-action="clear-filters">' + esc(t('clearFilters')) + '</button>'
      : state.scope === 'saved'
        ? '<button type="button" class="link-btn" data-action="scope" data-scope="all">' + esc(t('goExplore')) + '</button>'
        : '<button type="button" class="link-btn" data-action="add">' + esc(t(state.mode === 'food' ? 'addFood' : 'addTravel')) + '</button>';
    return '<div class="empty"><p>' + esc(msg) + '</p>' + btn + '</div>';
  }

  function scoreLabel(s) {
    if (state.scope === 'mine') return s.score != null ? t('myScore') : t('noRating');
    return s.raters ? t('avgOf', { n: s.raters }) : t('noRating');
  }

  function renderPlace() {
    var p = placeById(state.placeId);
    if (!p) { goFeed(); return; }
    var c = catOf(p), s = stats(p), dist = haversine(XMUM, p);
    var link = safeURL(p.link);
    var coords = p.lat.toFixed(6) + ',' + p.lng.toFixed(6);
    var far = dist > 300000;
    var saved = store.isSaved(p.id);
    /* 像谷歌地图的地点卡片：名字下面一排按钮，导航是实心的，收藏、打分紧跟着，其余往右滑 */
    var actions = (far
      ? '<a class="btn" href="https://www.google.com/maps/search/?api=1&query=' + coords + '" target="_blank" rel="noopener">' + ICON.nav + esc(t('viewGoogle')) + '</a>'
      : '<a class="btn primary" href="https://www.google.com/maps/dir/?api=1&destination=' + coords + '" target="_blank" rel="noopener">' + ICON.nav + esc(t('navGoogle')) + '</a>') +
      '<button type="button" class="btn save-btn" data-action="toggle-save" aria-pressed="' + saved + '">' + (saved ? ICON.starOn + esc(t('wished')) : ICON.star + esc(t('wish'))) + '</button>' +
      '<button type="button" class="btn" data-action="write-review">' + ICON.pen + esc(t(p.mode === 'food' ? 'writeReview' : 'beenHere')) + '</button>' +
      (far ? '' : '<a class="btn" href="https://waze.com/ul?ll=' + coords + '&navigate=yes" target="_blank" rel="noopener">' + ICON.nav + esc(t('navWaze')) + '</a>');
    actions += '<button type="button" class="btn" data-action="copy-coords" data-c="' + coords + '">' + ICON.copy + esc(t('copyCoords')) + '</button>';
    if (link) actions += '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener nofollow">' + ICON.link + esc(t('openLink')) + '</a>';
    var photos = [];
    s.rs.forEach(function (r) { (r.photos || []).forEach(function (id) { photos.push(id); }); });
    photos = photos.slice(0, 12);
    var reviews = s.rs.slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
    var tags = '<span class="tag">' + catIconHTML(c) + esc(catName(c)) + '</span><span class="tag">' + esc(precLabel(p.precision)) + '</span>' +
      (p.mode === 'food' ? '<span class="tag">' + esc(t('tier_' + distTier(p))) + '</span>' : '') +
      '<span class="tag">' + esc(t('distFrom', { d: fmtDist(dist) })) + '</span>';

    var h = '<div class="view-top"><button type="button" class="icon-btn flat" data-action="back" aria-label="' + esc(t('back')) + '">' + ICON.back + '</button>' +
      (p.sample ? '<span class="badge">' + esc(t('sample')) + '</span>' : '') + '</div>' +
      '<div class="place-head"><h2>' + esc(placeTitle(p)) + '</h2>' +
      (placeSub(p) ? '<div class="alt">' + esc(placeSub(p)) + '</div>' : '') +
      '<div class="tags">' + tags + '</div></div>' +
      '<div class="actions place-actions">' + actions + '</div>' +
      /* 别人记过、我还没记的地方：直接在这里打分添加，不用再去搜 */
      (beenThere(p) ? '' : quickRateHTML('place-score', p.mode, false)) +
      (photos.length ? '<div class="photo-strip">' + photos.map(function (id) {
        return '<button type="button" class="ph" data-action="photo" data-id="' + esc(id) + '" data-group="place"><img data-photo="' + esc(id) + '" data-small alt=""></button>';
      }).join('') + '</div>' : '') +
      '<div class="stats">' +
      '<div class="stat"><b>' + (s.score != null ? '<span class="score-big" style="color:' + scoreColor(s.score) + '">' + fmtScore(s.score) + '</span>' : '—') + '</b><small>' + esc(scoreLabel(s)) + '</small></div>' +
      '<div class="stat"><b>' + (s.avgPrice ? 'RM ' + fmtPrice(s.avgPrice) : '—') + '</b><small>' + esc(t(p.mode === 'food' ? 'perPerson' : 'costLabel')) + '</small></div>' +
      '<div class="stat"><b>' + s.count + '</b><small>' + esc(t('reviewsLabel')) + '</small></div></div>';
    h += '<h3 class="sec-title">' + esc(t('reviewsTitle')) + '</h3><ul class="reviews">' + reviews.map(reviewHTML).join('') + '</ul>';
    view.innerHTML = h;

  function reviewHTML(r) {

    return '<li class="review">' + avatarHTML(name) + '<div class="rv-main">' +

      }).join('') + '</div>' : '') +

    h += '<div class="field"><span class="f-label">' + esc(t('photos')) + ' <small>· ' + esc(t('photoLimit', { n: MAX_PHOTOS })) + '</small></span><div class="photo-grid" id="f-photos"></div></div>';
    h += fieldHTML('f-price', esc(t(isFood ? 'priceFood' : 'priceTravel')), '<input id="f-price" class="input" type="number" inputmode="decimal" min="0" step="0.5"' + (isFood ? ' placeholder="12"' : '') + '>');

  /* ================= place search [建议] =================
   * 两个来源一起搜：
   * 1. 雪团自己的地点库（Supabase 里的 poi 表，马来西亚的 Overture 开放数据，店铺最全），按名字和距离排序；
   * 2. Photon（OpenStreetMap），补上城市、景点和国外的地方。
   * 同一个外部编号（ovt/… 或 node/…）算同一个地点，避免大家重复建同一家店。
   */
  var PHOTON_URL = 'https://photon.komoot.io/api/';
  /* 3. 维基百科（有坐标的词条）：像谷歌那样，搜“巴厘岛”“富士山”这种知名地方直接出来，中文名也认。
     有中文就搜中文维基，没有就搜英文维基 */
  var WIKI_TYPES = {
    country: ['city', 'city', 5], adm1st: ['city', 'city', 7], adm2nd: ['city', 'city', 9], adm3rd: ['city', 'city', 10],
    city: ['city', 'city', 10], isle: ['island', 'area', 9], mountain: ['nature', 'exact', 12], forest: ['nature', 'area', 11],
    waterbody: ['nature', 'area', 11], river: ['nature', 'area', 10], glacier: ['nature', 'area', 11], pass: ['nature', 'exact', 13],
    landmark: ['culture', 'exact', 15], airport: ['other', 'exact', 13], railwaystation: ['other', 'exact', 15], edu: ['culture', 'exact', 15]
  };
  function wikiSearch(q) {
    var zh = /[\u3400-\u9fff]/.test(q);
    var url = 'https://' + (zh ? 'zh' : 'en') + '.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*' +
      '&generator=prefixsearch&gpsnamespace=0&gpslimit=8&gpssearch=' + encodeURIComponent(q) +
      '&prop=coordinates%7Cdescription&coprop=type%7Cdim&colimit=50&redirects=1' + (zh ? '&variant=zh-cn' : '');
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error('wiki ' + res.status);
      return res.json();
    }).then(function (json) { return parseWiki(json, zh ? 'zh' : 'en', q); });
  }
  function parseWiki(json, lang, q) {
    var pages = (json && json.query && json.query.pages) || [];
    /* 搜“巴厘岛”会跳到词条“峇里岛”：显示用户搜的那个名字，词条名放在旁边 */
    var from = {};
    ((json && json.query && json.query.redirects) || []).forEach(function (r) {
      if (r.from && r.to && r.from.toLowerCase().indexOf(q.toLowerCase()) === 0 && !from[r.to]) from[r.to] = r.from;
    });
    return pages.slice().sort(function (a, b) { return (a.index || 0) - (b.index || 0); }).map(function (pg) {
      var co = pg.coordinates && pg.coordinates[0];
      if (!co || (co.globe && co.globe !== 'earth')) return null;
      var type = String(co.type || '').replace(/\(.*$/, '');
      if (type === 'event') return null;
      var info = WIKI_TYPES[type] || ['other', 'exact', 14];
      var zoom = info[2];
      if (co.dim) zoom = clamp(Math.round(Math.log(40000000 / co.dim) / Math.LN2) + 1, 4, 16);
      var shown = pg.title.toLowerCase().indexOf(q.toLowerCase()) !== 0 && from[pg.title] ? from[pg.title] : pg.title;
      return { osm: 'wiki/' + lang + '/' + pg.pageid, name: shown, alt: shown !== pg.title ? pg.title : '', lng: round6(co.lon), lat: round6(co.lat), mode: 'travel', cat: info[0], precision: info[1], where: pg.description || '', zoom: zoom, wiki: true };
    }).filter(Boolean).slice(0, 4);
  }
  var osm = { q: '', status: 'idle', results: [], timer: null, seq: 0 };
  function searchCenter() {
    if (state.me) return state.me;
    var c = map ? map.getCenter() : XMUM;
    return { lng: c.lng, lat: c.lat };
  }
  function poiSearch(q, c) {
    if (!sbClient || !sbClient.rpc) return Promise.reject(new Error('no poi'));
    return sbClient.rpc('search_poi', { q: q, near_lat: c.lat, near_lng: c.lng, lim: 15 }).then(function (r) {
      if (r.error) throw r.error;
      return (r.data || []).map(function (x) {
        return { osm: 'ovt/' + x.id, name: x.name, alt: x.alt_name || '', lng: round6(x.lng), lat: round6(x.lat), mode: x.mode, cat: x.cat, precision: 'exact', where: x.locality || '' };
      });
    });
  }
  function photonSearch(q, c) {
    var url = PHOTON_URL + '?q=' + encodeURIComponent(q) + '&limit=8&lat=' + c.lat.toFixed(4) + '&lon=' + c.lng.toFixed(4) + (state.lang === 'en' ? '&lang=en' : '');
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error('photon ' + res.status);
      return res.json();
    }).then(parsePhoton);
  }
  /* 按顺序合并；名字一样、又在 150 米内的算重复。
     维基的城市、海岛和 Photon 里 5 公里内的城市、地区算同一个（名字语言常常不一样） */
  function mergeResults() {
    var out = [];
    Array.prototype.forEach.call(arguments, function (list) {
      list.forEach(function (r) {
        var dup = out.some(function (x) {
          if (x.name.toLowerCase() === r.name.toLowerCase() && haversine(x, r) < 150) return true;
          return (x.wiki || r.wiki) && x.precision !== 'exact' && r.precision !== 'exact' && haversine(x, r) < 5000;
        });
        if (!dup) out.push(r);
      });
    });
    return out;
  }
  function queueOsmSearch() {
    var q = state.query.trim(), key = q.toLowerCase();
    clearTimeout(osm.timer);
    if (key.length < 2) { osm.q = key; osm.status = 'idle'; osm.results = []; osm.seq++; return; }
    if (osm.q === key && osm.status === 'done') return;
    osm.q = key; osm.status = 'loading';
    var seq = ++osm.seq;
    osm.timer = setTimeout(function () {
      var c = searchCenter();
      var fail = function () { return null; };
      Promise.all([poiSearch(q, c).catch(fail), photonSearch(q, c).catch(fail), wikiSearch(q).catch(fail)]).then(function (rs) {
        if (seq !== osm.seq) return;
        var poi = rs[0] || [], photon = rs[1] || [], wiki = rs[2] || [];
        if (!rs[0] && !rs[1] && !rs[2]) osm.status = 'fail';
        else {
          /* 知名地方排最前；正在加吃的，店铺排最前 */
          osm.results = state.view === 'add' && state.mode === 'food' ? mergeResults(poi, photon, wiki) : mergeResults(wiki, poi, photon);
          osm.status = 'done';
        }

      });
    }, 300);
  }
  function parsePhoton(json) {
    var seen = {};

      var pr = f.properties || {}, co = f.geometry && f.geometry.coordinates;
      if (!pr.name || !co || pr.osm_id == null) return null;
      var key = ({ N: 'node', W: 'way', R: 'relation' }[pr.osm_type] || pr.osm_type) + '/' + pr.osm_id;
      if (seen[key]) return null;
      seen[key] = 1;
      var g = guessFromOsm(pr);
      var where = [];
      [pr.city || pr.county, pr.state, pr.country].forEach(function (x) { if (x && where.indexOf(x) === -1 && x !== pr.name) where.push(x); });
      return { osm: key, name: pr.name, lng: round6(co[0]), lat: round6(co[1]), mode: g.mode, cat: g.cat, precision: g.precision, where: where.join(', ') };
    }).filter(Boolean);
  }
  var OSM_FOOD = {
    amenity: ['restaurant', 'fast_food', 'cafe', 'food_court', 'bar', 'pub', 'ice_cream', 'biergarten', 'bbq'],
    shop: ['bakery', 'deli', 'coffee', 'tea', 'beverages', 'confectionery', 'pastry', 'ice_cream']
  };
  function guessFromOsm(pr) {
    var k = pr.osm_key, v = pr.osm_value, type = pr.type;
    var food = !!(OSM_FOOD[k] && OSM_FOOD[k].indexOf(v) !== -1);
    var precision = 'exact';
    if (!food) {
      if (['city', 'country', 'state', 'county'].indexOf(type) !== -1 || (k === 'place' && ['city', 'town', 'country', 'state', 'province', 'region'].indexOf(v) !== -1)) precision = 'city';
      else if (['district', 'locality'].indexOf(type) !== -1 || k === 'boundary' || (k === 'place' && ['suburb', 'neighbourhood', 'quarter', 'village', 'hamlet', 'island', 'islet'].indexOf(v) !== -1)) precision = 'area';
    }
    var cat = null;
    if (food) {
      if (['cafe', 'coffee', 'tea', 'beverages'].indexOf(v) !== -1) cat = 'cafe';
      else if (['ice_cream', 'confectionery', 'pastry', 'bakery'].indexOf(v) !== -1) cat = 'sweet';
      else if (v === 'food_court') cat = 'street';
    } else if (precision === 'city') cat = 'city';
    else if (v === 'beach' || v === 'island' || v === 'islet') cat = 'island';
    else if (k === 'natural' || ['park', 'nature_reserve', 'national_park', 'garden'].indexOf(v) !== -1 || v === 'viewpoint') cat = 'nature';
    else if (k === 'shop' && ['mall', 'department_store'].indexOf(v) !== -1) cat = 'mall';
    else if (k === 'tourism' && ['hotel', 'hostel', 'guest_house', 'motel', 'resort', 'apartment'].indexOf(v) !== -1) cat = 'stay';
    else if (['theme_park', 'zoo', 'aquarium', 'water_park', 'amusement_arcade'].indexOf(v) !== -1) cat = 'fun';
    else if (k === 'historic' || v === 'place_of_worship' || ['museum', 'attraction', 'artwork', 'gallery'].indexOf(v) !== -1) cat = 'culture';
    return { mode: food ? 'food' : 'travel', cat: cat, precision: precision };
  }
  function osmExisting(r) {
    return store.places().filter(function (p) { return p.osm === r.osm && visibleToMe(p); })[0] || null;
  }
  function osmRowHTML(r, i) {
    var mode = CATS[r.mode], c = null;
    mode.forEach(function (x) { if (x.id === r.cat) c = x; });
    c = c || mode[mode.length - 1];
    var sub = [t(r.mode), catName(c), r.where, fmtDist(haversine(searchCenter(), r))].filter(Boolean).map(esc).join(' · ');
    var cta = osmExisting(r) ? t('osmOpen') : t('osmAdd');
    return '<li><button type="button" class="near-item" data-action="osm-pick" data-i="' + i + '">' + catIconHTML(c) +
      '<span class="near-text"><b>' + esc(r.name) + (r.alt ? ' <span class="muted">' + esc(r.alt) + '</span>' : '') + '</b><small>' + sub + '</small></span><span class="near-cta">' + esc(cta) + '</span></button></li>';
  }
  /* 从“加地点”进来时，用户已经选了吃还是玩，就不按搜索结果的类型切换 */
  /* 搜索里选中一个还不在雪团的地点：先像谷歌地图那样插一根红针、显示地点卡片，
     确认要加再进表单。从“加地点”进来的直接进表单 */
  function pickOsm(i) {
    var r = osm.results[i];
    if (!r) return;
    var existing = osmExisting(r);
    var adding = state.view === 'add';
    if (existing) {
      if (adding && existing.mode === state.mode) startReview(existing.id); else openPlace(existing.id);
      return;
    }
    if (adding) { addFromResult(r, true); return; }
    state.preview = r;
    state.view = 'preview';

    setSnap('half');
    flyTo([r.lng, r.lat], r.zoom || (r.precision === 'city' ? 10 : r.precision === 'area' ? 14 : 16.5));
  }
  function addFromResult(r, keepMode, rating) {
    if (!requireLogin()) return;
    var mode = keepMode ? state.mode : r.mode;
    if (mode !== state.mode) setMode(mode, { noFly: true });
    var precision = mode === 'food' ? 'exact' : r.precision;
    var cat = mode === r.mode ? r.cat : null;
    flyTo([r.lng, r.lat], (mode === r.mode && r.zoom) || (precision === 'city' ? 10 : precision === 'area' ? 14 : 16.5));
    startNewPlace({ lng: r.lng, lat: r.lat }, precision, NEAR_RADIUS[precision], { name: r.name, alt: r.alt, cat: cat, osm: r.osm, rating: rating });
  }
  /* 0–5 分一排按钮：点一下就带着分数进表单（地图卡片、地点页都用） */
  function quickRateHTML(action, mode, hint) {

      (r.where ? '<span class="tag">' + esc(r.where) + '</span>' : '') +
      '<span class="tag">' + esc(t('distFrom', { d: fmtDist(haversine(XMUM, r)) })) + '</span>';
    view.innerHTML = '<div class="view-top"><button type="button" class="icon-btn flat" data-action="back" aria-label="' + esc(t('back')) + '">' + ICON.back + '</button></div>' +
      '<div class="place-head"><h2>' + esc(r.name) + '</h2>' + (r.alt ? '<div class="alt">' + esc(r.alt) + '</div>' : '') +
      '<div class="tags">' + tags + '</div></div>' +
      quickRateHTML('preview-score', r.mode, true) +
      '<div class="actions"><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=' + coords + '" target="_blank" rel="noopener">' + ICON.nav + esc(t('navGoogle')) + '</a></div>';
  }

  function renderProfile() {
    var pf = me();
    var areas = store.areas(), remote = store.mode === 'remote', signedIn = store.signedIn();

      map.easeTo({ center: [p.lng, p.lat], padding: mapPadding(), duration: reduceMotion ? 0 : 450 });

  /* ================= pick a location ================= */
  var NEAR_RADIUS = { exact: 60, area: 800, city: 15000 };
  function defaultPrecision(z) {

  }
  function pickLngLat() {

  function startPick(ctx) {

  function cancelPick() {

  }
  function confirmPick() {

  function newForm(o) {

  /* 新地点：先看附近有没有已经存在的同类地点，有就让用户先确认是不是同一个 */

  /* 返回 { blob: 1280px 原图, thumb: 640px 小图 } */
  function compressImage(file) {
    function toBlob(src, maxSide, quality) {
      var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
      cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
      return new Promise(function (resolve) { cv.toBlob(function (b) { resolve(b); }, 'image/jpeg', quality); });
    }
    function fromImage(src) {
      return Promise.all([toBlob(src, 1280, 0.82), toBlob(src, THUMB_SIDE, 0.8)]).then(function (b) {
        if (src.close) src.close();
        return { blob: b[0], thumb: b[1] };
      });
    }
    function viaImg() {
      return new Promise(function (resolve, reject) {
        var img = new Image(), u = URL.createObjectURL(file);
        img.onload = function () { URL.revokeObjectURL(u); resolve(img); };
        img.onerror = function () { URL.revokeObjectURL(u); reject(new Error('decode')); };
        img.src = u;
      });
    }
    var bitmap = window.createImageBitmap ? createImageBitmap(file).catch(viaImg) : viaImg();
    return bitmap.then(fromImage);
  }

  function addFormPhotos(files) {
    var f = state.form;
    if (!f) return;
    var list = Array.prototype.slice.call(files || []).filter(function (x) { return /^image\//.test(x.type); }).slice(0, MAX_PHOTOS - f.photos.length);
    list.reduce(function (chain, file) {
      return chain.then(function () {
        return compressImage(file).then(function (out) {
          if (!out.blob || state.form !== f) return;
          f.photos.push({ id: uid('ph'), blob: out.blob, thumb: out.thumb, url: URL.createObjectURL(out.blob) });
          renderFormPhotos();
        }).catch(function () { toast(t('photoReadFail')); });
      });
    }, Promise.resolve());
  }

  function submitForm(e) {
    e.preventDefault();
    var f = state.form;
    if (!f) return;
    captureFormDraft();
    clearErrs();
    var d = f.draft || {};
    var p0 = f.placeId ? placeById(f.placeId) : null;
    var placeFields = formHasPlaceFields(f, p0);
    var bad = null;
    if (f.rating == null) { showErr('rating', t('errRating')); bad = bad || $('.score-input .sc'); }
    if (bad) { bad.focus({ preventScroll: true }); centerInPanel(bad, !reduceMotion); return; }

    var btn = $('#f-submit');
    if (btn) btn.disabled = true;
    if (f.visibility === 'public' && (d.nick || '').trim()) store.updateProfile({ name: d.nick.trim().slice(0, 20) });
    var placeData = placeFields ? {
      mode: p0 ? p0.mode : state.mode, cat: f.cat || 'other', precision: f.precision, lat: f.loc.lat, lng: f.loc.lng,
      name: ((d.name || '').trim() || t((p0 ? p0.mode : state.mode) === 'food' ? 'unnamedFood' : 'unnamedTravel')).slice(0, 60), altName: (d.alt || '').trim().slice(0, 60), link: safeURL(d.link), osm: f.osm
    } : null;
    var price = parseFloat(d.price);
    var rv = {
      rating: f.rating, price: isFinite(price) && price > 0 ? Math.round(price * 100) / 100 : null,
      text: (d.text || '').trim().slice(0, 1000), visibility: f.visibility
    };
    var newPhotos = f.photos.filter(function (ph) { return !ph.existing; });
    var keepPhotos = f.photos.filter(function (ph) { return ph.existing; }).map(function (ph) { return ph.id; });
    var placeStep = !placeData ? Promise.resolve(p0) : p0 ? store.updatePlace(p0.id, placeData) : store.addPlace(placeData);
    placeStep.then(function (place) {
      rv.placeId = place.id;
      var save = f.editId ? store.updateReview(f.editId, rv, keepPhotos, newPhotos) : store.addReview(rv, newPhotos);
      return save.then(function (res) { return { place: place, res: res }; });
    }).then(function (x) {
      state.form = null;
      var shared = x.res.review.visibility === 'public';
      if (!f.editId) {
        /* 新记录直接进我的地图 */

      refreshMap();

    }).catch(function (e) {
      if (window.console) console.warn('save:', e);
      if (btn) btn.disabled = false;
      toast(t('saveFail'));
    });
  }

  function importData(file) {
