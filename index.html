<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雪团 XueTuan</title>
<meta name="description" content="雪团：厦马同学自己的吃喝玩乐地图。记录去过的地方、打分、拍照，收藏想去的地方。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a18" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=ZCOOL+QingKe+HuangYou&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* Layout: full-bleed map with floating controls; one panel that is a bottom sheet on phones and a left column on desktop */
:root {
  --food: #D9432B;          /* sambal */
  --travel: #0F8B8D;        /* Selat Melaka */
  --accent: var(--food);
  --accent-ink: #FFFFFF;
  --bg: #EEF1EF;
  --surface: #FFFFFF;
  --surface-2: #F2F5F3;
  --ink: #17201B;
  --muted: #5D6A63;
  --line: #E0E6E2;
  --danger: #C4302B;
  --shadow: 0 6px 22px rgba(15, 30, 22, .14), 0 1px 3px rgba(15, 30, 22, .12);
  --font-ui: "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-display: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --sheet-peek: 138px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --food: #FF6B4E; --travel: #2DBDB8;
    --bg: #0E1311; --surface: #161C19; --surface-2: #1F2723; --ink: #E8EEEA; --muted: #98A69F; --line: #2B3530;
    --shadow: 0 8px 26px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --food: #FF6B4E; --travel: #2DBDB8;
  --bg: #0E1311; --surface: #161C19; --surface-2: #1F2723; --ink: #E8EEEA; --muted: #98A69F; --line: #2B3530;
  --shadow: 0 8px 26px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
html.mode-travel { --accent: var(--travel); }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
a { color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.maplibregl-canvas:focus-visible { outline: none; }
.muted { color: var(--muted); }

/* ---------- shell ---------- */
.app { position: fixed; inset: 0; }
.stage { position: absolute; inset: 0; --sheet-visible: 0px; }
#map {
  position: absolute; inset: 0;
  background-color: #06101a;
  background-image:
    radial-gradient(1.3px 1.3px at 8% 14%, rgba(255,255,255,.85) 50%, transparent 55%),
    radial-gradient(1px 1px at 23% 72%, rgba(255,255,255,.7) 50%, transparent 55%),
    radial-gradient(1.4px 1.4px at 37% 26%, rgba(255,255,255,.8) 50%, transparent 55%),
    radial-gradient(1px 1px at 52% 90%, rgba(255,255,255,.6) 50%, transparent 55%),
    radial-gradient(1.2px 1.2px at 66% 10%, rgba(255,255,255,.75) 50%, transparent 55%),
    radial-gradient(1px 1px at 79% 64%, rgba(255,255,255,.7) 50%, transparent 55%),
    radial-gradient(1.5px 1.5px at 92% 33%, rgba(255,255,255,.85) 50%, transparent 55%),
    radial-gradient(1px 1px at 13% 47%, rgba(255,255,255,.55) 50%, transparent 55%),
    radial-gradient(1px 1px at 44% 56%, rgba(255,255,255,.45) 50%, transparent 55%),
    radial-gradient(1.1px 1.1px at 85% 87%, rgba(255,255,255,.65) 50%, transparent 55%),
    radial-gradient(1px 1px at 60% 38%, rgba(255,255,255,.5) 50%, transparent 55%),
    radial-gradient(ellipse 75% 65% at 50% 45%, #14344d 0%, #0a1b2b 55%, #050b13 100%);
}
.map-error {
  position: absolute; inset: 0; z-index: 4; display: grid; place-items: center;
  padding: 24px; text-align: center; color: #E6EEF2; font-weight: 600; font-size: 15px;
}

/* ---------- top bar ---------- */
.topbar {
  position: absolute; z-index: 10;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px; pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand-badge {
  flex: none; width: 44px; height: 44px; border-radius: 13px;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 17px; line-height: 1; letter-spacing: .02em;
  box-shadow: var(--shadow); transition: background-color .3s;
}
.mode-switch {
  position: relative; flex: 1; max-width: 240px; min-width: 0; height: 44px; padding: 4px;
  display: flex; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow);
}
.mode-switch::before {
  content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
  border-radius: 10px; background: var(--accent);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), background-color .3s;
}
html.mode-travel .mode-switch::before { transform: translateX(100%); }
.mode-switch button {
  position: relative; z-index: 1; flex: 1; min-width: 0; border: 0; background: none; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); transition: color .2s;
}
.mode-switch button[aria-selected="true"] { color: var(--accent-ink); }
.mode-switch b { font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1; }
.mode-switch small { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
@media (max-width: 374px) { .mode-switch small { display: none; } }
.topbar-spacer { display: none; flex: 1 1 0; min-width: 0; pointer-events: none; }
.topbar .icon-btn, .topbar .brand-badge { width: 40px; height: 40px; border-radius: 13px; }
.topbar .brand-badge { font-size: 15px; }
.icon-btn {
  flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 14px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  display: grid; place-items: center;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.flat { width: 38px; height: 38px; border-radius: 12px; background: var(--surface-2); box-shadow: none; }
.lang-btn { font-weight: 800; font-size: 13px; letter-spacing: .03em; }

/* ---------- filters ---------- */
.filters {
  position: absolute; z-index: 9; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  display: flex; align-items: center; gap: 8px; overflow-x: auto;
  padding: 2px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  scrollbar-width: none; pointer-events: none;
}
.filters::-webkit-scrollbar { display: none; }
.filters > * { pointer-events: auto; flex: none; }
.chip {
  height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  box-shadow: 0 1px 3px rgba(15, 30, 22, .1);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: transparent; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15, 30, 22, .15); }
.form .seg { display: flex; }
.form .seg button { flex: 1; min-width: 0; padding: 0 8px; }
.filters .seg { background: var(--surface); box-shadow: 0 1px 3px rgba(15, 30, 22, .1); }
.filters .seg button { height: 26px; padding: 0 11px; font-size: 13px; }
.filters .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }

/* ---------- map tools + add button ---------- */
.tools {
  position: absolute; z-index: 9;
  right: max(12px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 110px);
  display: flex; flex-direction: column; gap: 8px;
}
.tools .icon-btn { width: 42px; height: 42px; border-radius: 13px; }
.tools .icon-btn svg { width: 21px; height: 21px; }
.desk-only { display: none !important; }
.fab {
  position: absolute; z-index: 11;
  right: max(14px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--sheet-visible) + 16px);
  height: 52px; padding: 0 22px 0 17px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 16px;
  display: flex; align-items: center; gap: 7px;
  box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 38%, transparent), var(--shadow);
  transition: bottom .34s cubic-bezier(.2, .8, .2, 1), transform .15s, background-color .3s;
}
.fab:active { transform: scale(.96); }
.fab svg { width: 22px; height: 22px; }
.fab-hint {
  position: absolute; z-index: 11;
  right: max(14px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--sheet-visible) + 80px);
  max-width: 220px; padding: 7px 11px; border-radius: 11px;
  background: var(--ink); color: var(--surface); font-size: 12.5px; font-weight: 600; line-height: 1.35;
  box-shadow: var(--shadow); transition: bottom .34s cubic-bezier(.2, .8, .2, 1);
}
.fab-hint::after { content: ""; position: absolute; right: 30px; bottom: -5px; width: 10px; height: 10px; background: inherit; transform: rotate(45deg); }
.attrib {
  position: absolute; z-index: 8;
  left: max(8px, env(safe-area-inset-left, 0px));
  bottom: calc(var(--sheet-visible) + 6px);
  max-width: calc(100% - 150px); padding: 2px 7px; border-radius: 6px;
  background: rgba(255, 255, 255, .8); color: #34403A; font-size: 10.5px; line-height: 1.45;
  transition: bottom .34s cubic-bezier(.2, .8, .2, 1);
}
.attrib a { color: inherit; text-decoration: none; }
.attrib a:hover { text-decoration: underline; }
body.picking .fab, body.picking .fab-hint, body.picking .filters { display: none; }
body.picking .mode-switch { pointer-events: none; opacity: .6; }
body.picking .attrib { bottom: calc(env(safe-area-inset-bottom, 0px) + 122px); }
.title-add { display: none; margin-left: auto; }
@media (max-width: 959px) {
  body[data-snap="half"] .fab, body[data-snap="full"] .fab,
  body[data-snap="half"] .fab-hint, body[data-snap="full"] .fab-hint { display: none; }
  body[data-snap="half"] .title-add, body[data-snap="full"] .title-add { display: inline-flex; }
}

/* ---------- pick mode ---------- */
.pick { position: absolute; inset: 0; z-index: 12; pointer-events: none; }
.pick-hint {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 66px); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 12px;
  background: var(--ink); color: var(--surface); font-size: 13.5px; font-weight: 600; text-align: center;
  box-shadow: var(--shadow);
}
.pick-pin { position: absolute; left: 50%; top: 50%; width: 46px; height: 58px; transform: translate(-50%, -100%); filter: drop-shadow(0 5px 6px rgba(0, 0, 0, .35)); animation: hover-pin 1.6s ease-in-out infinite; }
.pick-pin svg { width: 100%; height: 100%; display: block; }
.pick-pin path { fill: var(--accent); }
.pick-dot { position: absolute; left: 50%; top: 50%; width: 10px; height: 4px; margin: -2px 0 0 -5px; border-radius: 50%; background: rgba(0, 0, 0, .45); }
@keyframes hover-pin { 0%, 100% { transform: translate(-50%, -100%); } 50% { transform: translate(-50%, calc(-100% - 7px)); } }
.pick-bar {
  position: absolute; pointer-events: auto;
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  max-width: 460px; margin: 0 auto; padding: 12px; border-radius: 18px;
  background: var(--surface); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
}
.pick-prec { font-size: 13px; color: var(--muted); text-align: center; }
.pick-prec b { color: var(--ink); }
.pick-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }

/* ---------- panel (sheet on phones) ---------- */
.panel {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
  height: calc(100vh - 66px);
  height: calc(100dvh - env(safe-area-inset-top, 0px) - 66px);
  display: flex; flex-direction: column;
  background: var(--surface); border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 34px rgba(10, 20, 15, .22);
  transform: translateY(calc(100% - var(--visible, 138px)));
  transition: transform .34s cubic-bezier(.2, .8, .2, 1);
}
.panel.dragging { transition: none; }
.panel::after { content: ""; flex: none; height: var(--hidden, 0px); }
.grip { flex: none; height: 26px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grip span { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
.panel-brand { display: none; align-items: center; gap: 12px; padding: 18px 20px 12px; }
.brand-name { font-weight: 800; font-size: 17px; letter-spacing: -.01em; line-height: 1.2; }
.brand-name span { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin-right: 2px; }
.brand-tag { font-size: 12.5px; color: var(--muted); }
.panel-body {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}

/* ---------- views ---------- */
.title-row { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
.view-title { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.title-row .view-title { cursor: pointer; }
.count { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.area-row { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: none; }
.area-row::-webkit-scrollbar { display: none; }
.area-chip {
  flex: none; height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.area-chip.add { background: none; border-style: dashed; color: var(--muted); }
.sample-note {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 0 0 4px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2);
  font-size: 12.5px; color: var(--muted);
}
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.link-btn.danger { color: var(--danger); }
.sample-note .link-btn { flex: none; white-space: nowrap; }
.top-cta { margin-left: auto; }
.feed, .reviews, .near-list, .search-results, .area-list { list-style: none; margin: 0; padding: 0; }
.feed-item {
  width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: start;
  padding: 13px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left;
}
.feed-item:hover { background: var(--surface-2); }
.avatar {
  flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: hsl(var(--h, 200) 42% 44%); color: #fff; font-weight: 800; font-size: 15px;
}
.fi-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.fi-who, .rv-who { min-width: 0; display: flex; align-items: baseline; gap: 6px; font-size: 13px; }
.fi-who b, .rv-who b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi-who .muted, .rv-who .muted { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi-time { margin-left: auto; padding-left: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.fi-place { display: flex; align-items: center; gap: 7px; font-size: 15.5px; font-weight: 700; line-height: 1.35; }
.fi-meta, .rv-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sep { opacity: .5; }
.fi-text { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.fi-thumb { width: 58px; height: 58px; border-radius: 10px; object-fit: cover; background: var(--surface-2); }
.badge {
  flex: none; display: inline-flex; align-items: center; height: 19px; padding: 0 7px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
}
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 11.5px; font-weight: 700; }
.score {
  flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 20px; padding: 0 6px;
  border-radius: 6px; background: var(--c); color: #fff; font-size: 12px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;
}
.score-big { font-size: 26px; }
.cat-ic { flex: none; font-style: normal; font-size: 15px; line-height: 1; }
.near-item > .cat-ic { width: 22px; text-align: center; font-size: 18px; }
.legend {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px;
  background: var(--surface); color: var(--muted); font-size: 11.5px; font-weight: 700; box-shadow: 0 1px 3px rgba(15, 30, 22, .1);
}
.legend b { font-weight: 700; }
.legend i { width: 54px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #8E9893, #F08C00, #D7261E); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 20px 4px; }
.empty p { margin: 0; max-width: 34ch; color: var(--muted); font-size: 14.5px; }
.empty.small { padding: 16px 4px; color: var(--muted); font-size: 14px; }

.view-top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 2px 0 12px; background: var(--surface); }
.view-top .view-title { flex: 1; min-width: 0; }
.place-head h2 { margin: 0; font-size: 24px; font-weight: 800; line-height: 1.2; letter-spacing: -.015em; text-wrap: balance; overflow-wrap: anywhere; }
.alt { margin-top: 3px; color: var(--muted); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--surface-2); font-size: 12.5px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 16px 0 14px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.stat b { font-size: 21px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat small { color: var(--muted); font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .btn { flex: 1 1 auto; }
.photo-strip { display: flex; gap: 8px; overflow-x: auto; margin: 14px 0 2px; padding-bottom: 4px; }
.ph { flex: none; width: 96px; height: 96px; padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph.sm { width: 72px; height: 72px; border-radius: 10px; }
.missing img { visibility: hidden; }
.sec-title { margin: 20px 0 2px; font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
.review { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.rv-main { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.rv-who { width: 100%; }
.rv-text { margin: 2px 0 0; font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rv-photos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

.btn {

.field { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.f-label { font-size: 13px; font-weight: 700; color: var(--muted); }
.f-label small { font-weight: 600; }
.input {
  width: 100%; min-height: 46px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface-2); color: var(--ink); font: inherit; font-size: 16px;
}
textarea.input { min-height: 98px; resize: vertical; line-height: 1.5; }
.input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 13%, transparent); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.f-hint { margin: 0; color: var(--muted); font-size: 12.5px; }
.f-err { color: var(--danger); font-size: 12.5px; font-weight: 700; }
.chips-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
.chips-wrap .chip { background: var(--surface-2); box-shadow: none; }
.chips-wrap .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.f-loc { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.form-place { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.score-input { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.score-input .sc {
  height: 46px; padding: 0; border: 2px solid var(--line); border-radius: 12px; background: var(--surface-2);
  color: var(--ink); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums;
}
.score-input .sc[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }

.ph-add {

.ph-add svg { width: 22px; height: 22px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.near-item {

}
.near-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.near-text b { overflow-wrap: anywhere; }
.near-text small { color: var(--muted); font-size: 12.5px; }

.note { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: 13px; }
.about { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

/* ---------- overlays ---------- */
.toast {
  position: fixed; z-index: 60; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 112px); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 128px); padding: 10px 16px; border-radius: 12px; text-align: center;
  background: var(--ink); color: var(--surface); font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
}
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; background: rgba(8, 14, 11, .48); }
.modal-card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.modal-card h3 { margin: 0; font-size: 18px; }
.modal-card p { margin: 0; }
.lightbox { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(5, 8, 7, .93); }
.lightbox img { max-width: min(92vw, 1200px); max-height: 84vh; border-radius: 8px; object-fit: contain; }
.lb-btn { position: absolute; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .14); color: #fff; font-size: 22px; display: grid; place-items: center; }
.lb-close { top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(14px, env(safe-area-inset-right, 0px)); }
.lb-prev { left: max(14px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); }
.lb-next { right: max(14px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); }
.lb-count { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); color: #fff; font-size: 13px; font-weight: 600; }
.drop-pulse { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); animation: drop-pulse 1.4s ease-out 1 forwards; }
@keyframes drop-pulse {
  0% { transform: scale(.4); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  60% { transform: scale(1); box-shadow: 0 0 0 26px transparent; }
  100% { transform: scale(1); opacity: 0; box-shadow: 0 0 0 30px transparent; }
}

/* ---------- desktop ---------- */
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 400px minmax(0, 1fr); }
  .stage { position: relative; }
  .panel {
    position: relative; z-index: 5; height: auto; transform: none !important; transition: none;
    border-radius: 0; box-shadow: none; border-right: 1px solid var(--line);

  .grip, .brand-top, .panel::after { display: none; }
  .panel-brand { display: flex; }

  .feed-item { border-radius: 10px; padding: 13px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .pick-pin, .drop-pulse { animation: none; }
  .panel, .fab, .fab-hint, .attrib, .mode-switch::before { transition: none; }

  function drawPin(color, emoji) {
    var w = 40, h = 52;
    var cv = document.createElement('canvas');
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    var g = cv.getContext('2d');
    g.scale(DPR, DPR);
    g.save();
    g.shadowColor = 'rgba(0,0,0,.32)'; g.shadowBlur = 4; g.shadowOffsetY = 1.5;
    g.beginPath();
    g.moveTo(20, 47);
    g.bezierCurveTo(16, 39, 5, 31, 5, 18);
    g.arc(20, 18, 15, Math.PI, 0);
    g.bezierCurveTo(35, 31, 24, 39, 20, 47);
    g.closePath();
    g.fillStyle = color; g.fill();
    g.restore();
    g.lineWidth = 2; g.strokeStyle = '#ffffff'; g.stroke();
    g.beginPath(); g.arc(20, 18, 11, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill();
    g.font = '13px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emoji, 20, 19);
    return g.getImageData(0, 0, cv.width, cv.height);

    return new Promise(function (resolve) {
      try {

    var layers = ['cl-circle', 'pt-pin', 'pt-label'].filter(function (id) { return map.getLayer(id); });
    var box = [[e.point.x - 12, e.point.y - 12], [e.point.x + 12, e.point.y + 10]];
    var hits = layers.length ? map.queryRenderedFeatures(box, { layers: layers }) : [];
    if (hits.length) {
      var f = hits[0];
      if (f.properties && f.properties.cluster) {
        var src = map.getSource('places');
        clusterZoom(src, f.properties.cluster_id).then(function (z) {

  (function setupDrag() {
    var grip = $('#grip'), drag = null;
    function snaps() { return ['peek', 'half', 'full'].map(function (s) { return { s: s, v: snapVisible(s) }; }); }
    grip.addEventListener('pointerdown', function (e) {
      if (!isMobile()) return;
      drag = { y0: e.clientY, t0: performance.now(), start: snapVisible(state.snap), vis: snapVisible(state.snap), moved: false };
      panel.classList.add('dragging');
      try { grip.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    grip.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dy = e.clientY - drag.y0;
      if (Math.abs(dy) > 4) drag.moved = true;
      drag.vis = clamp(drag.start - dy, 60, panel.offsetHeight);
      panel.style.setProperty('--visible', drag.vis + 'px');
    });
    function end(e) {
      if (!drag) return;
      panel.classList.remove('dragging');
      var d = drag; drag = null;
      if (!d.moved) {
        setSnap(state.snap === 'peek' ? 'half' : state.snap === 'half' ? (state.view === 'feed' ? 'full' : 'peek') : 'half');
        return;
      }
      var dt = Math.max(1, performance.now() - d.t0);
      var velocity = (d.vis - d.start) / dt;
      var target = d.vis + velocity * 220;
      var best = snaps().reduce(function (a, b) { return Math.abs(b.v - target) < Math.abs(a.v - target) ? b : a; });
      setSnap(best.s);
    }
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  })();

  /* ================= place search (OpenStreetMap via Photon) [建议] =================
   * Photon 是基于 OSM 的免费地点搜索，支持边打字边搜、不需要 key。
   * 同一个 OSM 编号算同一个地点，避免大家重复建同一家店。
   */
  var PHOTON_URL = 'https://photon.komoot.io/api/';
  var osm = { q: '', status: 'idle', results: [], timer: null, seq: 0 };
  function queueOsmSearch() {
    var q = state.query.trim(), key = q.toLowerCase();
    clearTimeout(osm.timer);
    if (key.length < 2) { osm.q = key; osm.status = 'idle'; osm.results = []; osm.seq++; return; }
    if (osm.q === key && osm.status === 'done') return;
    osm.q = key; osm.status = 'loading';
    var seq = ++osm.seq;
    osm.timer = setTimeout(function () {
      var c = map ? map.getCenter() : XMUM;
      var url = PHOTON_URL + '?q=' + encodeURIComponent(q) + '&limit=8&lat=' + c.lat.toFixed(4) + '&lon=' + c.lng.toFixed(4) + (state.lang === 'en' ? '&lang=en' : '');
      fetch(url).then(function (res) {
        if (!res.ok) throw new Error('photon ' + res.status);
        return res.json();
      }).then(function (json) {
        if (seq !== osm.seq) return;
        osm.results = parsePhoton(json);
        osm.status = 'done';
        renderSearchResults();
      }).catch(function () {
        if (seq !== osm.seq) return;
        osm.status = 'fail';
        renderSearchResults();
      });
    }, 350);
  }
  function parsePhoton(json) {
    var seen = {};
    return ((json && json.features) || []).map(function (f) {
      var pr = f.properties || {}, co = f.geometry && f.geometry.coordinates;
      if (!pr.name || !co || pr.osm_id == null) return null;
      var key = ({ N: 'node', W: 'way', R: 'relation' }[pr.osm_type] || pr.osm_type) + '/' + pr.osm_id;
      if (seen[key]) return null;
      seen[key] = 1;
      var g = guessFromOsm(pr);
      var where = [];
      [pr.city || pr.county, pr.state, pr.country].forEach(function (x) { if (x && where.indexOf(x) === -1 && x !== pr.name) where.push(x); });
      return { osm: key, name: pr.name, lng: round6(co[0]), lat: round6(co[1]), mode: g.mode, cat: g.cat, precision: g.precision, where: where.join(', ') };
    }).filter(Boolean);
  }
  var OSM_FOOD = {
    amenity: ['restaurant', 'fast_food', 'cafe', 'food_court', 'bar', 'pub', 'ice_cream', 'biergarten', 'bbq'],
    shop: ['bakery', 'deli', 'coffee', 'tea', 'beverages', 'confectionery', 'pastry', 'ice_cream']
  };
  function guessFromOsm(pr) {
    var k = pr.osm_key, v = pr.osm_value, type = pr.type;
    var food = !!(OSM_FOOD[k] && OSM_FOOD[k].indexOf(v) !== -1);
    var precision = 'exact';
    if (!food) {
      if (['city', 'country', 'state', 'county'].indexOf(type) !== -1 || (k === 'place' && ['city', 'town', 'country', 'state', 'province', 'region'].indexOf(v) !== -1)) precision = 'city';
      else if (['district', 'locality'].indexOf(type) !== -1 || k === 'boundary' || (k === 'place' && ['suburb', 'neighbourhood', 'quarter', 'village', 'hamlet', 'island', 'islet'].indexOf(v) !== -1)) precision = 'area';
    }
    var cat = null;
    if (food) {
      if (['cafe', 'coffee', 'tea', 'beverages'].indexOf(v) !== -1) cat = 'cafe';
      else if (['ice_cream', 'confectionery', 'pastry', 'bakery'].indexOf(v) !== -1) cat = 'sweet';
      else if (v === 'food_court') cat = 'street';
    } else if (precision === 'city') cat = 'city';
    else if (v === 'beach' || v === 'island' || v === 'islet') cat = 'island';
    else if (k === 'natural' || ['park', 'nature_reserve', 'national_park', 'garden'].indexOf(v) !== -1 || v === 'viewpoint') cat = 'nature';
    else if (k === 'shop' && ['mall', 'department_store'].indexOf(v) !== -1) cat = 'mall';
    else if (k === 'tourism' && ['hotel', 'hostel', 'guest_house', 'motel', 'resort', 'apartment'].indexOf(v) !== -1) cat = 'stay';
    else if (['theme_park', 'zoo', 'aquarium', 'water_park', 'amusement_arcade'].indexOf(v) !== -1) cat = 'fun';
    else if (k === 'historic' || v === 'place_of_worship' || ['museum', 'attraction', 'artwork', 'gallery'].indexOf(v) !== -1) cat = 'culture';
    return { mode: food ? 'food' : 'travel', cat: cat, precision: precision };
  }
  function osmExisting(r) {
    return store.places().filter(function (p) { return p.osm === r.osm && visibleToMe(p); })[0] || null;
  }
  function osmRowHTML(r, i) {
    var mode = CATS[r.mode], c = null;
    mode.forEach(function (x) { if (x.id === r.cat) c = x; });
    c = c || mode[mode.length - 1];
    var sub = [t(r.mode), r.where, fmtDist(haversine(XMUM, r))].filter(Boolean).map(esc).join(' · ');
    var cta = osmExisting(r) ? t('osmOpen') : t('osmAdd');

  /* 从“加地点”进来时，用户已经选了吃还是玩，就不按搜索结果的类型切换 */

  /* ================= navigation ================= */
  function goFeed(snap) {

  function openPlace(id, opts) {

    if (p.mode !== state.mode) setMode(p.mode, { noFly: true });
    if (!scopedReviews(p.id).length && reviewsOf(p.id).some(isMine)) {
      state.scope = 'mine'; renderFilters(); refreshMap();
    }
    if (state.view === 'feed') state.feedSnap = state.snap;
    state.view = 'place'; state.placeId = id; state.form = null;
    render();
    setSnap('half');
    updateSelection();
    if (map && opts.fly !== false) {
      var z = map.getZoom();
      var target = p.precision === 'city' ? Math.max(Math.min(z, 10), 8) : p.precision === 'area' ? Math.max(z, 13) : Math.max(z, 15.5);
      flyTo([p.lng, p.lat], target);

      state.view = 'place'; state.placeId = pid; render(); setSnap('half'); updateSelection();

  /* ================= pick a location ================= */
  var NEAR_RADIUS = { exact: 60, area: 800, city: 15000 };

  }
  function pickLngLat() {

  /* 新地点：先看附近有没有已经存在的同类地点，有就让用户先确认是不是同一个 */

  function compressImage(file) {
    var maxSide = 1280;
    function fromImage(src) {
      var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
      cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
      return new Promise(function (resolve) { cv.toBlob(function (b) { resolve(b); }, 'image/jpeg', 0.82); });
    }
    function viaImg() {
      return new Promise(function (resolve, reject) {
        var img = new Image(), u = URL.createObjectURL(file);
        img.onload = function () { URL.revokeObjectURL(u); resolve(img); };
        img.onerror = function () { URL.revokeObjectURL(u); reject(new Error('decode')); };
        img.src = u;
      });
    }
    var bitmap = window.createImageBitmap ? createImageBitmap(file).catch(viaImg) : viaImg();
    return bitmap.then(fromImage);
  }

    list.reduce(function (chain, file) {
      return chain.then(function () {
        return compressImage(file).then(function (blob) {
          if (!blob || state.form !== f) return;
          f.photos.push({ id: uid('ph'), blob: blob, url: URL.createObjectURL(blob) });
          renderFormPhotos();

    }, Promise.resolve());
  }

  function submitForm(e) {
    e.preventDefault();

    captureFormDraft();
    clearErrs();
    var d = f.draft || {};
    var p0 = f.placeId ? placeById(f.placeId) : null;
    var placeFields = formHasPlaceFields(f, p0);
    var bad = null;
    if (placeFields && !(d.name || '').trim()) { showErr('f-name', t('errName')); bad = bad || $('#f-name'); }
    if (placeFields && !f.cat) { showErr('cat', t('errCat')); bad = bad || $('.chips-wrap .chip'); }
    if (f.rating == null) { showErr('rating', t('errRating')); bad = bad || $('.score-input .sc'); }
    if (bad) { bad.focus(); bad.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); return; }

    var btn = $('#f-submit');
    if (btn) btn.disabled = true;
    if ((d.nick || '').trim()) store.updateProfile({ name: d.nick.trim().slice(0, 20) });
    var placeData = placeFields ? {
      mode: p0 ? p0.mode : state.mode, cat: f.cat, precision: f.precision, lat: f.loc.lat, lng: f.loc.lng,
      name: d.name.trim().slice(0, 60), altName: (d.alt || '').trim().slice(0, 60), link: safeURL(d.link), osm: f.osm
    } : null;
    var price = parseFloat(d.price);
    var rv = {
      rating: f.rating, price: isFinite(price) && price > 0 ? Math.round(price * 100) / 100 : null,
      text: (d.text || '').trim().slice(0, 1000), visibility: f.visibility
    };
    var newPhotos = f.photos.filter(function (ph) { return !ph.existing; });
    var keepPhotos = f.photos.filter(function (ph) { return ph.existing; }).map(function (ph) { return ph.id; });
    var placeStep = !placeData ? Promise.resolve(p0) : p0 ? store.updatePlace(p0.id, placeData) : store.addPlace(placeData);
    placeStep.then(function (place) {
      rv.placeId = place.id;

    }).catch(function () {
      if (btn) btn.disabled = false;

  }

    if (e.target.id === 'modal') { closeModal(false); return; }
    if (e.target.id === 'lightbox') { closeLightbox(); return; }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.dataset.action, d = el.dataset;
    switch (a) {
      case 'mode': if (state.view !== 'feed') goFeed(); setMode(d.mode); break;
      case 'scope':
        state.scope = d.scope; renderFilters(); refreshMap();
        if (state.view === 'place' && !scopedReviews(state.placeId).length) goFeed();
        else if (state.view === 'feed' || state.view === 'place') render();
        break;
      case 'cat': state.cat = d.cat; refilter(); break;
      case 'price': state.priceMax = PRICE_STEPS[(PRICE_STEPS.indexOf(state.priceMax) + 1) % PRICE_STEPS.length]; refilter(); break;
      case 'score': state.minScore = SCORE_STEPS[(SCORE_STEPS.indexOf(state.minScore) + 1) % SCORE_STEPS.length]; refilter(); break;
      case 'dist': state.dist = DIST_STEPS[(DIST_STEPS.indexOf(state.dist) + 1) % DIST_STEPS.length]; refilter(); break;
      case 'clear-filters': state.cat = 'all'; state.priceMax = 0; state.minScore = 0; state.dist = 'any'; renderFilters(); refreshMap(); render(); break;
      case 'search': if (state.view === 'feed') state.feedSnap = state.snap; state.view = 'search'; render(); setSnap('full'); break;
      case 'profile': if (state.view === 'feed') state.feedSnap = state.snap; state.view = 'profile'; render(); setSnap('full'); break;
      case 'lang': setLang(state.lang === 'zh' ? 'en' : 'zh'); break;
      case 'set-lang': setLang(d.lang); break;
      case 'set-style': setBasemap(d.style); break;
      case 'basemap': setBasemap(STYLE_ORDER[(STYLE_ORDER.indexOf(state.styleKey) + 1) % STYLE_ORDER.length]); break;
      case 'zoom-in': if (map) map.zoomIn(); break;
      case 'zoom-out': if (map) map.zoomOut(); break;
      case 'to-school': flyTo([XMUM.lng, XMUM.lat], 15.5); break;
      case 'to-globe': if (map) flyTo([map.getCenter().lng, Math.max(-40, Math.min(40, map.getCenter().lat))], 1.4); break;
      case 'locate': locate(); break;
      case 'add': openAdd(); break;
      case 'add-pin': startPick({}); break;
      case 'add-existing': startReview(d.id); break;
      case 'pick-cancel': cancelPick(); break;
      case 'pick-confirm': confirmPick(); break;
      case 'expand': if (isMobile()) setSnap(state.snap === 'peek' ? 'half' : state.snap === 'half' ? 'full' : 'half'); break;
      case 'goto-area': gotoArea(d.id); break;
      case 'save-area': openAreaDialog(); break;
      case 'del-area': store.deleteArea(d.id).then(render); break;
      case 'clear-samples': clearSamples(); break;
      case 'open-place': openPlace(d.id); break;
      case 'back': back(); break;
      case 'write-review': if (state.placeId) startReview(state.placeId); break;
      case 'toggle-save': if (state.placeId) toggleSave(state.placeId); break;
      case 'copy-coords': copyCoords(d.c); break;
      case 'photo': openLightbox(d.id, d.group); break;
      case 'edit-review': startEdit(d.id); break;
      case 'del-review': deleteReview(d.id); break;
      case 'form-cancel': formCancel(); break;
      case 'repick': captureFormDraft(); startPick({ repick: true }); break;
      case 'f-cat': state.form.cat = d.cat; setPressed('[data-action="f-cat"]', 'cat', d.cat); $('#err-cat').hidden = true; break;
      case 'f-prec': state.form.precision = d.prec; setPressed('[data-action="f-prec"]', 'prec', d.prec); break;
      case 'f-vis': state.form.visibility = d.vis; setPressed('[data-action="f-vis"]', 'vis', d.vis); break;
      case 'f-score': state.form.rating = +d.n; setPressed('[data-action="f-score"]', 'n', d.n); $('#err-rating').hidden = true; break;
      case 'f-photo-add': $('#f-file').click(); break;
      case 'f-photo-del':
        state.form.photos = state.form.photos.filter(function (ph) {
          if (ph.id === d.id && !ph.existing) URL.revokeObjectURL(ph.url);
          return ph.id !== d.id;
        });
        renderFormPhotos(); break;
      case 'nearby-back': state.form = null; goFeed(); break;
      case 'near-pick': state.form.placeId = d.id; state.view = 'form'; render(); break;
      case 'near-new': state.view = 'form'; render(); break;
      case 'osm-pick': pickOsm(+d.i); break;
      case 'export': exportData(); break;
      case 'import': $('#import-file').click(); break;
      case 'lb-close': closeLightbox(); break;
      case 'lb-prev': lb.i = (lb.i - 1 + lb.ids.length) % lb.ids.length; showLightbox(); break;
      case 'lb-next': lb.i = (lb.i + 1) % lb.ids.length; showLightbox(); break;
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id === 'place-form') submitForm(e);
    else if (e.target.id === 'area-form') { e.preventDefault(); saveArea(); }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'q') { state.query = el.value; queueOsmSearch(); renderSearchResults(); }
    else if (el.dataset && el.dataset.pf) { var patch = {}; patch[el.dataset.pf] = el.value.trim(); store.updateProfile(patch); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'f-file') { addFormPhotos(e.target.files); e.target.value = ''; }
    else if (e.target.id === 'import-file') { importData(e.target.files[0]); e.target.value = ''; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('#lightbox').hidden) closeLightbox();
    else if (!$('#modal').hidden) closeModal(false);
    else if (state.picking) cancelPick();
    else if (state.view !== 'feed') back();
  });
  $('#filters').addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.currentTarget.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });
  var onBreakpoint = function () { applySnap(); if (map) setTimeout(function () { map.resize(); }, 60); };
  if (mqMobile.addEventListener) mqMobile.addEventListener('change', onBreakpoint); else mqMobile.addListener(onBreakpoint);
  window.addEventListener('resize', function () { applySnap(); });
  var mqDark = window.matchMedia('(prefers-color-scheme: dark)');
  if (mqDark.addEventListener) mqDark.addEventListener('change', repaintAccent);

  /* ================= boot ================= */
  store.init().then(function () {
    var savedView = loadView();
    if (savedView) {
      if (savedView.lang === 'en' || savedView.lang === 'zh') state.lang = savedView.lang;
      if (savedView.mode === 'travel' || savedView.mode === 'food') state.mode = savedView.mode;
      if (STYLE_URLS[savedView.styleKey]) state.styleKey = savedView.styleKey;
    }
    applyStaticI18n();
    renderChrome();
    render();
    setSnap('peek');
    initMap();
  });
})();
</script>
</body>
</html>
