<script>
(function () {
  var root = document.documentElement, el = document.getElementById('splash');
  if (!el) return;
  if (!root.classList.contains('splash-on')) { el.parentNode.removeChild(el); return; }
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), h = '', i, s;
  /* 雪花：每片的位置、大小、快慢都随机一点 */
  if (!reduce) for (i = 0; i < 46; i++) {
    s = 2 + Math.random() * 4.5;
    h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;animation-delay:' + (0.95 + Math.random() * 0.75).toFixed(2) + 's;animation-duration:' + (1.5 + Math.random() * 1.1).toFixed(2) + 's;--dx:' + Math.round(Math.random() * 44 - 22) + 'px"></i>';
  }
  document.getElementById('sp-flakes').innerHTML = h;
  var done = false;
  function finish() {
    if (done || window.__splashHold) return; done = true; /* __splashHold：测试截每一帧时先别收 */
    root.classList.add('splash-out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); root.classList.remove('splash-on', 'splash-out', 'splash-go'); }, 420);
  }
  el.addEventListener('click', finish);
  /* 等第一帧真的画出来再开始动（手机慢的时候不会一打开就只看到结尾），之后约 2.9 秒进首页 */
  var go = function () { if (done || root.classList.contains('splash-go')) return; root.classList.add('splash-go'); setTimeout(finish, reduce ? 1100 : 2850); };
  if (window.requestAnimationFrame) requestAnimationFrame(function () { requestAnimationFrame(go); }); else go();
  setTimeout(go, 600);
  setTimeout(function () { if (!root.classList.contains('splash-go')) finish(); }, 6000); /* 一直没画出来（比如在后台打开）就别挡着 */
})();
</script>

        <div class="brand-tag" data-i18n="tagline">中国有美团，雪邦有雪团</div>
      </div>
    </div>
    <div class="panel-body" id="view"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="map" id="map"></div>
    <div class="map-error" id="map-error" hidden></div>

    <div class="map-ctrls" id="map-ctrls"></div>
    <div class="map-chips" id="map-chips"></div>

    <button type="button" class="add-fab" id="fab" data-action="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" class="icon-btn locate-btn" data-action="locate" data-i18n-aria="locate" data-i18n-title="locate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button>
    <button type="button" class="icon-btn campus-btn" data-action="campus" data-i18n-aria="toCampus" data-i18n-title="toCampus"><img class="xmum-buildings" src="assets/xmum-campus.png" width="34" height="34" alt=""></button>

    <div class="pick" id="pick" hidden>
      <button type="button" class="icon-btn pick-campus" data-action="pick-campus" data-i18n-aria="toCampus" data-i18n-title="toCampus"><img src="assets/xmum-campus.png" width="34" height="34" alt=""></button>
      <div class="pick-search" id="pick-search">
        <div class="search-box"><img class="search-symbol" src="assets/search-pin.png" alt=""><input id="pick-q" class="input" type="search" autocomplete="off" enterkeyhint="search" maxlength="60" placeholder="搜城市、街区，地图飞过去" aria-label="搜城市、街区"></div>
        <ul class="pick-results" id="pick-results" hidden></ul>
      </div>
      <div class="pick-hint" id="pick-hint"></div>
      <div class="pick-dot"></div>
      <div class="pick-pin"><svg viewBox="0 0 46 58"><path d="M23 56C18 46 4 36 4 21a19 19 0 0 1 38 0c0 15-14 25-19 35z" stroke="#fff" stroke-width="3"/><circle cx="23" cy="21" r="7" fill="#fff"/></svg></div>
      <div class="pick-bar">
        <div class="pick-prec" id="pick-prec"></div>
        <div class="pick-actions">
          <button type="button" class="btn ghost" data-action="pick-cancel" data-i18n="cancel">取消</button>
          <button type="button" class="btn primary" data-action="pick-confirm" data-i18n="confirmSpot">就是这里</button>
        </div>
      </div>
    </div>

    <div class="attrib"><a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
  </main>

  <nav class="tabbar" id="tabbar" data-i18n-aria="tabsAria">
    <button type="button" class="tab" data-action="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="9" rx="2"/><rect x="13" y="4" width="7" height="5" rx="2"/><rect x="4" y="15" width="7" height="5" rx="2"/><rect x="13" y="11" width="7" height="9" rx="2"/></svg><span data-i18n="tabHome">首页</span></button>
    <button type="button" class="tab" data-action="tab" data-tab="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span data-i18n="tabExplore">探索</span></button>
    <button type="button" class="tab" data-action="tab" data-tab="foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 6.5 5.5-2.5 6 2.5 5.5-2.5v13.5l-5.5 2.5-6-2.5-5.5 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span data-i18n="tabFoot">足迹</span></button>
    <button type="button" class="tab" data-action="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/></svg><span data-i18n="tabMe">我的</span></button>
  </nav>
</div>

<div class="bsheet" id="bsheet" hidden><div class="bsheet-card" id="bsheet-card" role="dialog" aria-modal="true"></div></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="modal" id="modal" hidden></div>
<div class="lightbox" id="lightbox" hidden>
  <img id="lb-img" alt="">
  <video id="lb-vid" muted loop autoplay playsinline hidden></video>
  <button type="button" class="lb-btn lb-close" data-action="lb-close" data-i18n-aria="close">✕</button>

  <span class="lb-hint lb-hint-r" id="lb-hint-r" aria-hidden="true" hidden>›</span>
  <div class="lb-navigation" id="lb-navigation">
    <button type="button" class="lb-btn lb-prev" id="lb-prev" data-action="lb-prev" aria-label="上一张">‹</button>
    <div class="lb-count" id="lb-count" aria-live="polite"></div>
    <button type="button" class="lb-btn lb-next" id="lb-next" data-action="lb-next" aria-label="下一张">›</button>
  </div>
  <div class="lb-status" id="lb-status" role="status" hidden><span id="lb-status-text"></span><button type="button" class="link-btn" id="lb-retry" data-action="lb-retry" hidden>重试</button></div>

</div>
