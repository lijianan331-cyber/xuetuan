<script>
/* 开屏（用户 2026-11-02）：打开 app 先放一秒多，点一下就跳过；同一个标签页只放一次。
   自动化测试（navigator.webdriver）里不放，网址加 ?splash 强制放 */
(function () {
  try {
    var force = /[?&]splash(=|&|$)/.test(location.search);
    if (!force && (navigator.webdriver || sessionStorage.getItem('xuetuan:splash'))) return;
    sessionStorage.setItem('xuetuan:splash', '1');
    document.documentElement.classList.add('splash-on');
  } catch (e) {}
})();
</script>

<body>
<!-- 开屏（用户 2026-11-02 改成短版）：像 Instagram / 抖音那样全屏一个 logo，飘一点小雪，一秒多就进首页（只在 html.splash-on 时显示） -->
<div class="splash" id="splash" aria-hidden="true"><div class="sp-flakes" id="sp-flakes"></div><div class="sp-mark"><svg class="sp-ball" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="sp-mg" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#fff"/><stop offset=".62" stop-color="#F3F8FD"/><stop offset="1" stop-color="#D5E5F4"/></radialGradient></defs><circle cx="50" cy="52" r="37" fill="url(#sp-mg)"/><circle cx="38.5" cy="50" r="5" fill="#1E3350"/><circle cx="40.2" cy="48.3" r="1.6" fill="#fff"/><path d="M56.5 51.2q5.6-6.4 11.4 0" fill="none" stroke="#1E3350" stroke-width="3.4" stroke-linecap="round"/><path d="M42 59.5h16a8 7.4 0 0 1-16 0z" fill="#1E3350"/><ellipse cx="50" cy="64.4" rx="4" ry="2.2" fill="#F28BA0"/><ellipse cx="30.5" cy="60" rx="6" ry="3.6" fill="#F6A9B8" opacity=".8"/><ellipse cx="69.5" cy="60" rx="6" ry="3.6" fill="#F6A9B8" opacity=".8"/><path d="M84 9c1 6.6 2.8 8.4 9.4 9.4-6.6 1-8.4 2.8-9.4 9.4-1-6.6-2.8-8.4-9.4-9.4 6.6-1 8.4-2.8 9.4-9.4z" fill="#fff"/></svg><b>雪团</b></div><small class="sp-tag">XMUMer 的图鉴</small></div>
<script>
(function () {
  var root = document.documentElement, el = document.getElementById('splash');
  if (!el) return;
  if (!root.classList.contains('splash-on')) { el.parentNode.removeChild(el); return; }
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), h = '', i, s, d;
  /* 小雪：一打开就已经在飘（负的延迟），点点 + 几朵六角雪花，位置、大小、快慢随机 */
  if (!reduce) for (i = 0; i < 30; i++) {
    s = i % 6 === 0 ? 12 + Math.random() * 6 : 2.5 + Math.random() * 3.5; d = 3.2 + Math.random() * 2.6;
    h += '<i' + (i % 6 === 0 ? ' class="sf"' : '') + ' style="left:' + (Math.random() * 100).toFixed(1) + '%;width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;animation-duration:' + d.toFixed(2) + 's;animation-delay:-' + (Math.random() * d).toFixed(2) + 's;--dx:' + Math.round(Math.random() * 36 - 18) + 'px"></i>';
  }
  document.getElementById('sp-flakes').innerHTML = h;
  var done = false;
  function finish() {
    if (done || window.__splashHold) return; done = true; /* __splashHold：测试截图时先别收 */
    root.classList.add('splash-out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); root.classList.remove('splash-on', 'splash-out', 'splash-go'); }, 320);
  }
  el.addEventListener('click', finish);
  /* 等第一帧画出来再计时，约 1.2 秒后进首页 */
  var go = function () { if (done || root.classList.contains('splash-go')) return; root.classList.add('splash-go'); setTimeout(finish, reduce ? 800 : 1200); };
  if (window.requestAnimationFrame) requestAnimationFrame(function () { requestAnimationFrame(go); }); else go();
  setTimeout(go, 500);
  setTimeout(function () { if (!root.classList.contains('splash-go')) finish(); }, 4000); /* 一直没画出来（比如在后台打开）就别挡着 */
})();
</script>
