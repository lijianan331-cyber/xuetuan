# 打包雪团安卓 app（android/ 里的 WebView 壳），发到 GitHub Releases。
# 手机下载地址固定：https://github.com/lijianan331-cyber/xuetuan/releases/latest/download/xuetuan.apk
# 网站的改动 app 里自动就有；只有改了 android/ 才会重新打包。
name: Android app

on:
  # Publish only after the matching website and login have been verified.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest 自带安卓 SDK（ANDROID_HOME），不用再装
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # 签名钥匙：仓库 Settings → Secrets 里有 XT_KEYSTORE_B64 和 XT_STORE_PASS 就用它（以后更新能直接覆盖安装）；
      # 缺少正式签名时中止发布，避免发布无法覆盖安装的包。
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.XT_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.XT_STORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ]; then
            echo "::error::Configure the existing release signing key before publishing an APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xt.jks"
          echo "XT_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "XT_KEYSTORE=$RUNNER_TEMP/xt.jks" >> "$GITHUB_ENV"
      - name: Build APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk xuetuan.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: 雪团 app 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            雪团安卓 app。手机上点下面的 xuetuan.apk 下载安装（第一次装要允许“安装未知来源应用”）。
            app 打开的就是雪团网站，网站更新后 app 里自动是新的，不用重装。
          files: xuetuan.apk
