name: Web checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      XUETUAN_TEST_BROWSER_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test tools
        shell: pwsh
        run: |
          python -m pip install playwright==1.63.0 Pillow==13.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP/xuetuan-checks" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.15
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "XUETUAN_TEST_PGLITE=$env:RUNNER_TEMP/xuetuan-checks/node_modules/@electric-sql/pglite/dist/index.js" >> $env:GITHUB_ENV
      - name: Database and focused regressions
        shell: pwsh
        run: |
          node tests/test_account_deletion.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_visit_activity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_search_mode.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_media_urls.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_security.mjs $env:XUETUAN_TEST_PGLITE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_bounded_reads.mjs $env:XUETUAN_TEST_PGLITE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Browser regression
        run: python tests/test_app.py
